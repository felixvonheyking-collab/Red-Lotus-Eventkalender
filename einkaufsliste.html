<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red Lotus · Einkaufsliste / Rezepturen</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RL Einkauf">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c1b1a">
<link rel="manifest" href="manifest-einkauf.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c1b1a;
  --ink-2:#2a2726;
  --ink-3:#3a3634;
  --red:#8f1d33;
  --red-deep:#6b1526;
  --red-bright:#b02942;
  --gold:#c9a35e;
  --gold-soft:#e4cf9c;
  --cream:#f6efe2;
  --cream-dim:#e9ddc6;
  --line:rgba(201,163,94,0.28);
  --ok:#5c8362;
  --warn:#c9793e;
  --shadow:0 12px 32px rgba(0,0,0,0.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(143,29,51,0.25), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(201,163,94,0.12), transparent 55%),
    var(--ink);
  color:var(--cream);
  font-family:'Work Sans',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.wordmark{font-family:'Marcellus',serif;letter-spacing:0.04em;}
.app{max-width:1000px;margin:0 auto;padding:20px 16px 80px;}
header.top{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-radius:16px;
  background:linear-gradient(135deg, var(--ink-2), var(--ink-3));
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  margin-bottom:18px;gap:12px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{
  width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--red-bright), var(--red-deep) 70%);
  border:2px solid var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-family:'Marcellus',serif;color:var(--gold-soft);font-size:20px;flex-shrink:0;
}
.brand h1{font-size:19px;margin:0;font-weight:600;}
.brand .sub{font-size:11.5px;color:var(--gold-soft);opacity:0.85;letter-spacing:0.08em;text-transform:uppercase;}
.top-actions{display:flex;gap:8px;align-items:center;}
.btn{
  border:1px solid var(--line);background:var(--ink-2);color:var(--cream);
  padding:9px 14px;border-radius:10px;font-size:13px;cursor:pointer;font-weight:500;
  font-family:'Work Sans',sans-serif;transition:all .15s;
}
.btn:hover{border-color:var(--gold);}
.btn.gold{background:linear-gradient(135deg, var(--gold), #a9813f);color:#241c0f;border-color:var(--gold);font-weight:600;}
.btn.red{background:var(--red);border-color:var(--red-bright);color:#fff;}
.btn.ghost{background:transparent;}
.btn.sm{padding:6px 10px;font-size:12px;}
.btn:disabled{opacity:0.5;cursor:default;}
.icon-btn{background:transparent;border:1px solid var(--line);color:var(--cream);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
.icon-btn:hover{border-color:var(--gold);}
.icon-btn.danger:hover{border-color:var(--red-bright);color:var(--red-bright);}

/* TABS */
.brand-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.brand-tabs button{
  background:transparent;border:1px solid var(--line);color:var(--cream);
  padding:9px 16px;border-radius:10px;font-size:13px;cursor:pointer;font-weight:500;
  font-family:'Work Sans',sans-serif;
}
.brand-tabs button.active{background:var(--red);border-color:var(--red-bright);color:#fff;}
.brand-tabs button:hover{border-color:var(--gold);}
.view-toggle{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;justify-content:space-between;align-items:center;}
.view-toggle .seg{display:flex;gap:4px;background:var(--ink-2);padding:4px;border-radius:10px;border:1px solid var(--line);}
.view-toggle .seg button{background:transparent;border:none;color:var(--cream-dim);padding:7px 13px;border-radius:7px;font-size:12.5px;cursor:pointer;font-family:'Work Sans',sans-serif;}
.view-toggle .seg button.active{background:var(--gold);color:#241c0f;font-weight:600;}

.card{
  background:var(--ink-2);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow);
}
.recipe-row{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;}
.recipe-row .name{font-family:'Marcellus',serif;font-size:17px;}
.recipe-row .meta{font-size:11.5px;color:var(--gold-soft);opacity:0.85;margin-top:2px;}
.recipe-row .actions{display:flex;gap:6px;flex-shrink:0;}
.brand-pill{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:0.04em;margin-right:6px;}
.brand-pill.redlotus{background:rgba(143,29,51,0.35);color:#f2c9d1;border:1px solid rgba(176,41,66,0.5);}
.brand-pill.limethyme{background:rgba(92,131,98,0.3);color:#cfe8d4;border:1px solid rgba(92,131,98,0.5);}

.editor{margin-top:14px;border-top:1px solid var(--line);padding-top:14px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:11.5px;color:var(--gold-soft);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:5px;}
.field input,.field select{
  width:100%;background:var(--ink-3);border:1px solid var(--line);color:var(--cream);
  padding:9px 10px;border-radius:8px;font-size:14px;font-family:'Work Sans',sans-serif;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--gold);}
.row-inline{display:flex;gap:10px;flex-wrap:wrap;}
.row-inline .field{flex:1;min-width:120px;}

.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table.ing-table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px;}
table.ing-table th{text-align:left;font-size:10.5px;color:var(--gold-soft);text-transform:uppercase;letter-spacing:0.04em;padding:6px 6px;border-bottom:1px solid var(--line);}
table.ing-table td{padding:5px 6px;border-bottom:1px solid rgba(201,163,94,0.12);}
table.ing-table input,table.ing-table select{
  width:100%;background:var(--ink-3);border:1px solid var(--line);color:var(--cream);
  padding:6px 7px;border-radius:7px;font-size:12.5px;font-family:'Work Sans',sans-serif;
}
.hint{font-size:11.5px;color:var(--cream-dim);opacity:0.75;margin-top:6px;line-height:1.5;}
.empty-state{text-align:center;padding:40px 20px;color:var(--cream-dim);opacity:0.7;font-size:13.5px;}

/* Rezepte im Ganzen (Übersicht) */
.overview-recipe{margin-bottom:18px;}
.overview-recipe h3{font-family:'Marcellus',serif;font-size:17px;margin:0 0 6px;}
.overview-recipe .cat-group{margin-bottom:6px;}
.overview-recipe .cat-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--gold-soft);opacity:0.85;margin:8px 0 3px;}
.overview-recipe ul{margin:0;padding-left:18px;font-size:13px;}
.overview-recipe li{margin-bottom:2px;}

/* Rezeptbuch (Zutaten + Zubereitung, lesbar & copy-fähig) */
.book-card .book-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
.book-card .zubereitung{white-space:pre-wrap;font-size:13.5px;line-height:1.6;}
.book-card .no-steps{font-size:12.5px;color:var(--cream-dim);opacity:0.7;font-style:italic;}
.field textarea{
  width:100%;background:var(--ink-3);border:1px solid var(--line);color:var(--cream);
  padding:9px 10px;border-radius:8px;font-size:14px;font-family:'Work Sans',sans-serif;
  min-height:110px;resize:vertical;
}
.field textarea:focus{outline:none;border-color:var(--gold);}

/* LOGIN */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:90vh;padding:16px;}
.login-card{
  background:var(--ink-2);border:1px solid var(--line);border-radius:18px;padding:28px 24px;
  max-width:360px;width:100%;text-align:center;box-shadow:var(--shadow);
}
.login-card h1{margin:8px 0 2px;font-size:24px;}
.login-card .sub{font-size:12px;color:var(--gold-soft);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:18px;}
.login-card .field{text-align:left;}
.login-error{background:rgba(176,41,66,0.2);border:1px solid var(--red-bright);color:#f2c9d1;padding:9px 12px;border-radius:8px;font-size:12.5px;margin-bottom:14px;text-align:left;}
.login-hint{font-size:11px;color:var(--cream-dim);opacity:0.7;margin-top:14px;line-height:1.5;}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,0.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;margin-right:6px;vertical-align:-1px;}
@keyframes spin{to{transform:rotate(360deg);}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink-3);border:1px solid var(--gold);color:var(--cream);padding:11px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);z-index:999;max-width:90vw;}
.toast.err{border-color:var(--red-bright);color:#f2c9d1;}

@media (max-width:600px){
  .app{padding:12px 8px 70px;}
  header.top{padding:10px 12px;}
  .brand h1{font-size:16px;}
}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js';
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut,
  GoogleAuthProvider, signInWithPopup
} from 'https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js';
import {
  getFirestore, initializeFirestore, collection, doc, setDoc, deleteDoc, onSnapshot
} from 'https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js';

function showFatalError(title, detail){
  const el = document.getElementById('app');
  if(!el) return;
  el.innerHTML = `<div style="max-width:600px;margin:60px auto;padding:20px;background:#2a1116;border:1px solid #b02942;border-radius:14px;color:#f6efe2;font-family:sans-serif;">
    <h2 style="color:#f2c9d1;margin-top:0;">${(title||'').toString().replace(/</g,'&lt;')}</h2>
    <p style="font-size:13px;opacity:0.85;white-space:pre-wrap;word-break:break-word;">${(detail||'').toString().replace(/</g,'&lt;')}</p>
    <p style="font-size:12px;opacity:0.6;">Bitte mach hiervon einen Screenshot.</p>
  </div>`;
}
window.addEventListener('error', (ev)=>{ showFatalError('Es ist ein Fehler aufgetreten', (ev.message||'')+' ('+(ev.filename||'')+':'+(ev.lineno||'')+')'); });
window.addEventListener('unhandledrejection', (ev)=>{ showFatalError('Es ist ein Fehler aufgetreten', ev.reason && ev.reason.message ? ev.reason.message : String(ev.reason)); });

const firebaseConfig = {
  apiKey: "AIzaSyA0y6NWpF3N7241mA72Cj-gU_pvbqpNdD4",
  authDomain: "red-lotus-eventkalender.firebaseapp.com",
  projectId: "red-lotus-eventkalender",
  storageBucket: "red-lotus-eventkalender.firebasestorage.app",
  messagingSenderId: "864967561482",
  appId: "1:864967561482:web:98ee51f304748e511f2af3"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = initializeFirestore(fbApp, { experimentalAutoDetectLongPolling: true }, "default");
const googleProvider = new GoogleAuthProvider();

/* ============================= KONSTANTEN ============================= */
const BRANDS = [
  { id:'redlotus', label:'Red Lotus' },
  { id:'limethyme', label:'Lime & Thyme' }
];
const EINHEITEN = ['g','kg','mg','ml','l','Stück'];
const KATEGORIEN = ['Fleisch','Gemüse','Sonstiges','Vorrat'];

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ============================= STATE ============================= */
const state = {
  authUser:null, authError:null, authBusy:false, loaded:false,
  recipes:{},
  activeBrand:'redlotus',
  viewMode:'liste', // 'liste' | 'ganzes'
  openRecipeId:null,
  editingIngredients:null, // Array während des Bearbeitens
  toast:null
};
let unsubRecipes = null;

function startSync(){
  unsubRecipes = onSnapshot(collection(db,'recipes'), snap=>{
    const recipes = {};
    snap.docs.forEach(d=>{ recipes[d.id] = {id:d.id, ...d.data()}; });
    state.recipes = recipes;
    state.loaded = true;
    render();
  }, err=>{ console.error('Firestore-Fehler (recipes):', err); showToast('Fehler beim Laden: '+err.message, true); });
}
function stopSync(){ if(unsubRecipes){ unsubRecipes(); unsubRecipes=null; } }

async function copyToClipboard(text){
  try{
    await navigator.clipboard.writeText(text);
    showToast('In die Zwischenablage kopiert.');
  }catch(e){
    showToast('Kopieren nicht möglich: '+(e.message||e), true);
  }
}
function showToast(msg, isErr){
  state.toast = {msg, isErr};
  render();
  setTimeout(()=>{ state.toast=null; render(); }, 3200);
}

/* ============================= FIRESTORE OPS ============================= */
async function saveRecipe(recipe){
  const ref = doc(db,'recipes', recipe.id);
  const { id, ...data } = recipe;
  await setDoc(ref, data, {merge:false});
}
async function deleteRecipe(id){
  await deleteDoc(doc(db,'recipes', id));
}
async function duplicateRecipe(recipe){
  const copy = {
    ...recipe,
    id: uid(),
    name: recipe.name + ' (Kopie)',
    ingredients: (recipe.ingredients||[]).map(ing=>({...ing}))
  };
  await saveRecipe(copy);
  state.openRecipeId = copy.id;
  showToast('Rezeptur dupliziert.');
}

/* ============================= LOGIN ============================= */
function renderLogin(){
  return `
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand-mark" style="margin:0 auto 10px;"></div>
      <h1 class="wordmark">Red Lotus</h1>
      <div class="sub">Einkaufsliste · Rezepturen</div>
      ${state.authError ? `<div class="login-error">${escapeHtml(state.authError)}</div>` : ''}
      <button type="button" class="btn gold" id="googleLoginBtn" ${state.authBusy?'disabled':''} style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px;width:100%;">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.85.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
        ${state.authBusy?'Anmelden…':'Mit Google anmelden'}
      </button>
      <div style="display:flex;align-items:center;gap:10px;margin:14px 0;opacity:0.4;font-size:11px;">
        <div style="flex:1;height:1px;background:var(--line);"></div>ODER<div style="flex:1;height:1px;background:var(--line);"></div>
      </div>
      <div class="field"><label>E-Mail</label><input type="email" id="login-email" autocomplete="username"></div>
      <div class="field"><label>Passwort</label><input type="password" id="login-pass" autocomplete="current-password"></div>
      <button type="button" class="btn ghost" id="loginBtn" ${state.authBusy?'disabled':''} style="width:100%;padding:11px;">${state.authBusy?'<span class="spinner"></span>Anmelden…':'Mit E-Mail anmelden'}</button>
      <div class="login-hint">Gleicher Zugang wie im Red-Lotus-Eventkalender.</div>
    </div>
  </div>`;
}
function attachLoginHandlers(){
  const doLogin = async ()=>{
    const email = document.getElementById('login-email').value.trim();
    const pass = document.getElementById('login-pass').value;
    if(!email || !pass){ state.authError='Bitte E-Mail und Passwort eingeben.'; render(); return; }
    state.authBusy=true; state.authError=null; render();
    try{ await signInWithEmailAndPassword(auth, email, pass); }
    catch(e){ state.authBusy=false; state.authError=mapAuthError(e); render(); }
  };
  const btn = document.getElementById('loginBtn');
  if(btn) btn.onclick = doLogin;
  ['login-email','login-pass'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.onkeydown = (ev)=>{ if(ev.key==='Enter') doLogin(); };
  });
  const googleBtn = document.getElementById('googleLoginBtn');
  if(googleBtn) googleBtn.onclick = async ()=>{
    state.authBusy=true; state.authError=null; render();
    try{ await signInWithPopup(auth, googleProvider); }
    catch(e){ state.authBusy=false; state.authError=mapAuthError(e); render(); }
  };
}
function mapAuthError(e){
  const code = e && e.code || '';
  if(code.includes('invalid-credential') || code.includes('wrong-password') || code.includes('user-not-found')) return 'E-Mail oder Passwort ist falsch.';
  if(code.includes('too-many-requests')) return 'Zu viele Versuche. Bitte kurz warten und erneut versuchen.';
  if(code.includes('invalid-email')) return 'Diese E-Mail-Adresse ist ungültig.';
  if(code.includes('popup-closed-by-user') || code.includes('cancelled-popup-request')) return 'Google-Anmeldung abgebrochen.';
  if(code.includes('popup-blocked')) return 'Der Anmelde-Pop-up wurde blockiert. Bitte Pop-ups erlauben.';
  if(code === 'permission-denied' || code.includes('permission-denied')) return 'Dieses Konto ist nicht freigeschaltet. Bitte bei Felix melden.';
  return 'Anmeldung fehlgeschlagen: '+(e.message||e);
}

/* ============================= RECIPE LIST / EDITOR ============================= */
function recipesForBrand(brand){
  return Object.values(state.recipes||{}).filter(r=>(r.brand||'redlotus')===brand).sort((a,b)=>(a.name||'').localeCompare(b.name||'','de'));
}
function newIngredientRow(){
  return { zutat:'', mengeProPerson:'', einheit:'g', faktor:1, kategorie:'Sonstiges' };
}
function renderIngredientEditorRows(rows){
  return rows.map((ing,i)=>`
    <tr data-ing-idx="${i}">
      <td><input type="text" data-ing-field="zutat" value="${escapeHtml(ing.zutat)}" placeholder="z. B. Hähnchenbrust"></td>
      <td><input type="number" step="0.1" data-ing-field="mengeProPerson" value="${escapeHtml(ing.mengeProPerson)}" placeholder="Menge/Person"></td>
      <td><select data-ing-field="einheit">${EINHEITEN.map(e=>`<option value="${e}" ${ing.einheit===e?'selected':''}>${e}</option>`).join('')}</select></td>
      <td><input type="number" step="0.1" data-ing-field="faktor" value="${escapeHtml(ing.faktor)}" placeholder="1"></td>
      <td><select data-ing-field="kategorie">${KATEGORIEN.map(k=>`<option value="${k}" ${ing.kategorie===k?'selected':''}>${k}</option>`).join('')}</select></td>
      <td><button type="button" class="icon-btn danger" data-remove-ing="${i}">✕</button></td>
    </tr>`).join('');
}
function renderRecipeEditor(recipe){
  const rows = state.editingIngredients || recipe.ingredients || [];
  return `
  <div class="editor">
    <div class="row-inline">
      <div class="field" style="flex:2;"><label>Name der Rezeptur</label><input type="text" id="recipeNameInput" value="${escapeHtml(recipe.name||'')}" placeholder="z. B. Panang Curry"></div>
      <div class="field"><label>Marke</label>
        <select id="recipeBrandInput">${BRANDS.map(b=>`<option value="${b.id}" ${(recipe.brand||'redlotus')===b.id?'selected':''}>${b.label}</option>`).join('')}</select>
      </div>
    </div>
    <div class="table-scroll">
      <table class="ing-table" id="ingTable">
        <thead><tr><th>Zutat</th><th>Menge/Person</th><th>Einheit</th><th>Faktor</th><th>Kategorie</th><th></th></tr></thead>
        <tbody>${renderIngredientEditorRows(rows)}</tbody>
      </table>
    </div>
    <button type="button" class="btn ghost sm" id="addIngRowBtn" style="margin-top:8px;">+ Zutat hinzufügen</button>
    <div class="hint">„Vorrat" wird bei der automatischen Einkaufsmengen-Berechnung im Kalender nicht mitgezählt (z. B. Gewürze, die immer vorrätig sind). Der Faktor multipliziert die Menge zusätzlich (z. B. für Schwund/Reserve).</div>
    <div class="field" style="margin-top:14px;">
      <label>Zubereitung</label>
      <textarea id="recipeZubereitungInput" placeholder="Schritt für Schritt, wie das Gericht zubereitet wird…">${escapeHtml(recipe.zubereitung||'')}</textarea>
      <div class="hint">Erscheint zusammen mit den Zutaten im „Rezeptbuch" — für dich und dein Team, komplett unabhängig von der Einkaufsmengen-Berechnung.</div>
    </div>
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">
      <button type="button" class="btn gold" id="saveRecipeBtn">Speichern</button>
      <button type="button" class="btn ghost" id="duplicateRecipeBtn">Duplizieren</button>
      <button type="button" class="btn ghost" id="cancelEditBtn">Abbrechen</button>
      <button type="button" class="btn red" id="deleteRecipeBtn" style="margin-left:auto;">Löschen</button>
    </div>
  </div>`;
}
function renderRecipeCard(recipe){
  const isOpen = state.openRecipeId === recipe.id;
  const ingCount = (recipe.ingredients||[]).length;
  return `
  <div class="card" data-recipe-id="${recipe.id}">
    <div class="recipe-row" data-toggle-recipe="${recipe.id}">
      <div>
        <div class="name">${escapeHtml(recipe.name||'(ohne Namen)')}</div>
        <div class="meta">${ingCount} Zutat${ingCount===1?'':'en'}</div>
      </div>
      <div class="actions">
        <button type="button" class="icon-btn" data-duplicate-recipe="${recipe.id}" title="Duplizieren">⧉</button>
        <span style="opacity:0.6;">${isOpen?'▲':'▼'}</span>
      </div>
    </div>
    ${isOpen ? renderRecipeEditor(recipe) : ''}
  </div>`;
}
function renderListView(){
  const list = recipesForBrand(state.activeBrand);
  const newCard = state.openRecipeId==='__new__' ? `
    <div class="card" data-recipe-id="__new__">
      <div class="name" style="font-family:'Marcellus',serif;font-size:17px;margin-bottom:4px;">Neue Rezeptur</div>
      ${renderRecipeEditor({id:'__new__', name:'', brand:state.activeBrand, ingredients:state.editingIngredients||[newIngredientRow()]})}
    </div>` : '';
  return `
    ${newCard}
    ${list.length ? list.map(renderRecipeCard).join('') : (state.openRecipeId==='__new__' ? '' : '<div class="empty-state">Noch keine Rezepturen für diese Marke angelegt.</div>')}
    <button type="button" class="btn gold" id="newRecipeBtn" style="width:100%;margin-top:6px;">+ Neue Rezeptur anlegen</button>
  `;
}
function renderGanzesView(){
  const list = recipesForBrand(state.activeBrand);
  if(!list.length) return '<div class="empty-state">Noch keine Rezepturen für diese Marke angelegt.</div>';
  return list.map(r=>{
    const byCat = {};
    (r.ingredients||[]).forEach(ing=>{
      const k = ing.kategorie||'Sonstiges';
      if(!byCat[k]) byCat[k]=[];
      byCat[k].push(ing);
    });
    const catsHtml = KATEGORIEN.filter(k=>byCat[k]&&byCat[k].length).map(k=>`
      <div class="cat-group">
        <div class="cat-label">${k}</div>
        <ul>${byCat[k].map(ing=>`<li>${escapeHtml(ing.zutat)} — ${escapeHtml(ing.mengeProPerson)}${escapeHtml(ing.einheit)} / Person${(ing.faktor&&ing.faktor!=1)?` · Faktor ${escapeHtml(ing.faktor)}`:''}</li>`).join('')}</ul>
      </div>`).join('');
    return `<div class="card overview-recipe"><h3>${escapeHtml(r.name||'(ohne Namen)')}</h3>${catsHtml || '<div class="hint">Keine Zutaten hinterlegt.</div>'}</div>`;
  }).join('');
}
function recipeAsPlainText(r){
  const lines = [`${r.name||'(ohne Namen)'}`, ''];
  lines.push('Zutaten:');
  (r.ingredients||[]).forEach(ing=>{
    lines.push(`- ${ing.zutat}${ing.mengeProPerson?` — ${ing.mengeProPerson}${ing.einheit||''} / Person`:''}`);
  });
  if(r.zubereitung && r.zubereitung.trim()){
    lines.push('', 'Zubereitung:', r.zubereitung.trim());
  }
  return lines.join('\n');
}
function renderRezeptbuchView(){
  const list = recipesForBrand(state.activeBrand);
  if(!list.length) return '<div class="empty-state">Noch keine Rezepturen für diese Marke angelegt.</div>';
  return list.map(r=>{
    const ingHtml = (r.ingredients||[]).length
      ? `<ul>${(r.ingredients||[]).map(ing=>`<li>${escapeHtml(ing.zutat)}${ing.mengeProPerson?` — ${escapeHtml(ing.mengeProPerson)}${escapeHtml(ing.einheit||'')} / Person`:''}</li>`).join('')}</ul>`
      : '<div class="hint">Keine Zutaten hinterlegt.</div>';
    const zubereitungHtml = (r.zubereitung && r.zubereitung.trim())
      ? `<div class="zubereitung">${escapeHtml(r.zubereitung.trim())}</div>`
      : '<div class="no-steps">Noch keine Zubereitung hinterlegt — unter „Rezepturen bearbeiten" ergänzbar.</div>';
    return `
    <div class="card book-card" data-book-id="${r.id}">
      <div class="book-head">
        <div class="name" style="font-family:'Marcellus',serif;font-size:18px;">${escapeHtml(r.name||'(ohne Namen)')}</div>
        <button type="button" class="btn ghost sm" data-copy-recipe="${r.id}">⧉ Kopieren</button>
      </div>
      <div class="cat-label">Zutaten (pro Person)</div>
      ${ingHtml}
      <div class="cat-label" style="margin-top:12px;">Zubereitung</div>
      ${zubereitungHtml}
    </div>`;
  }).join('');
}

/* ============================= MAIN RENDER ============================= */
function renderApp(){
  return `
  <div class="app">
    <header class="top">
      <div class="brand">
        <div class="brand-mark"></div>
        <div>
          <h1 class="wordmark">Einkaufsliste</h1>
          <div class="sub">Rezepturen &amp; Zutaten</div>
        </div>
      </div>
      <div class="top-actions">
        <a href="index.html" class="btn ghost sm">📅 Kalender</a>
        <a href="preisrechner.html" class="btn ghost sm">🧮 Preisrechner</a>
        <a href="alice.html" class="btn ghost sm">🤖 Alice</a>
        <button type="button" class="btn ghost sm" id="logoutBtn">Abmelden</button>
      </div>
    </header>

    <div class="brand-tabs">
      ${BRANDS.map(b=>`<button type="button" data-set-brand="${b.id}" class="${state.activeBrand===b.id?'active':''}">${b.id==='redlotus'?'🔴':'🟢'} ${b.label}</button>`).join('')}
    </div>

    <div class="view-toggle">
      <div class="seg">
        <button type="button" data-set-view="liste" class="${state.viewMode==='liste'?'active':''}">Rezepturen bearbeiten</button>
        <button type="button" data-set-view="ganzes" class="${state.viewMode==='ganzes'?'active':''}">Rezepte im Ganzen</button>
        <button type="button" data-set-view="buch" class="${state.viewMode==='buch'?'active':''}">📖 Rezeptbuch</button>
      </div>
    </div>

    ${!state.loaded ? '<div class="empty-state">Lade Rezepturen…</div>' : (
      state.viewMode==='liste' ? renderListView() :
      state.viewMode==='ganzes' ? renderGanzesView() :
      renderRezeptbuchView()
    )}
  </div>
  ${state.toast ? `<div class="toast ${state.toast.isErr?'err':''}">${escapeHtml(state.toast.msg)}</div>` : ''}
  `;
}

function render(){
  const el = document.getElementById('app');
  if(!state.authUser){
    el.innerHTML = renderLogin();
    attachLoginHandlers();
    return;
  }
  el.innerHTML = renderApp();
  attachAppHandlers();
}

function readIngredientRowsFromDom(){
  const rows = [];
  document.querySelectorAll('#ingTable tbody tr').forEach(tr=>{
    const row = {};
    tr.querySelectorAll('[data-ing-field]').forEach(inp=>{
      const field = inp.getAttribute('data-ing-field');
      row[field] = field==='mengeProPerson'||field==='faktor' ? (inp.value===''?'':parseFloat(inp.value)) : inp.value;
    });
    rows.push(row);
  });
  return rows;
}

function attachAppHandlers(){
  document.getElementById('logoutBtn').onclick = ()=> signOut(auth);
  document.querySelectorAll('[data-set-brand]').forEach(b=>{
    b.onclick = ()=>{ state.activeBrand = b.getAttribute('data-set-brand'); state.openRecipeId=null; state.editingIngredients=null; render(); };
  });
  document.querySelectorAll('[data-set-view]').forEach(b=>{
    b.onclick = ()=>{ state.viewMode = b.getAttribute('data-set-view'); state.openRecipeId=null; state.editingIngredients=null; render(); };
  });
  document.querySelectorAll('[data-toggle-recipe]').forEach(row=>{
    row.onclick = ()=>{
      const id = row.getAttribute('data-toggle-recipe');
      if(state.openRecipeId===id){ state.openRecipeId=null; state.editingIngredients=null; }
      else { state.openRecipeId=id; state.editingIngredients=null; }
      render();
    };
  });
  document.querySelectorAll('[data-copy-recipe]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.getAttribute('data-copy-recipe');
      const recipe = state.recipes[id];
      if(recipe) copyToClipboard(recipeAsPlainText(recipe));
    };
  });
  document.querySelectorAll('[data-duplicate-recipe]').forEach(btn=>{
    btn.onclick = async (ev)=>{
      ev.stopPropagation();
      const id = btn.getAttribute('data-duplicate-recipe');
      const recipe = state.recipes[id];
      if(recipe) await duplicateRecipe(recipe);
    };
  });
  const newBtn = document.getElementById('newRecipeBtn');
  if(newBtn) newBtn.onclick = ()=>{ state.openRecipeId='__new__'; state.editingIngredients=[newIngredientRow()]; render(); };

  const addIngBtn = document.getElementById('addIngRowBtn');
  if(addIngBtn) addIngBtn.onclick = ()=>{
    state.editingIngredients = readIngredientRowsFromDom();
    state.editingIngredients.push(newIngredientRow());
    render();
  };
  document.querySelectorAll('[data-remove-ing]').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = parseInt(btn.getAttribute('data-remove-ing'),10);
      const rows = readIngredientRowsFromDom();
      rows.splice(idx,1);
      state.editingIngredients = rows;
      render();
    };
  });

  const saveBtn = document.getElementById('saveRecipeBtn');
  if(saveBtn) saveBtn.onclick = async ()=>{
    const name = document.getElementById('recipeNameInput').value.trim();
    const brand = document.getElementById('recipeBrandInput').value;
    if(!name){ showToast('Bitte einen Namen eingeben.', true); return; }
    const ingredients = readIngredientRowsFromDom().filter(r=>r.zutat && r.zutat.trim());
    const zubereitung = document.getElementById('recipeZubereitungInput').value;
    const isNew = state.openRecipeId==='__new__';
    const id = isNew ? uid() : state.openRecipeId;
    saveBtn.disabled = true; saveBtn.textContent = 'Speichert…';
    try{
      await saveRecipe({ id, name, brand, ingredients, zubereitung });
      state.openRecipeId = null;
      state.editingIngredients = null;
      showToast('Rezeptur gespeichert.');
    }catch(e){
      showToast('Fehler beim Speichern: '+(e.message||e), true);
      saveBtn.disabled = false; saveBtn.textContent = 'Speichern';
    }
  };
  const dupBtn = document.getElementById('duplicateRecipeBtn');
  if(dupBtn) dupBtn.onclick = async ()=>{
    if(state.openRecipeId==='__new__') return;
    const recipe = state.recipes[state.openRecipeId];
    if(recipe) await duplicateRecipe(recipe);
  };
  const cancelBtn = document.getElementById('cancelEditBtn');
  if(cancelBtn) cancelBtn.onclick = ()=>{ state.openRecipeId=null; state.editingIngredients=null; render(); };
  const delBtn = document.getElementById('deleteRecipeBtn');
  if(delBtn) delBtn.onclick = async ()=>{
    if(state.openRecipeId==='__new__'){ state.openRecipeId=null; state.editingIngredients=null; render(); return; }
    if(!confirm('Diese Rezeptur wirklich löschen? Sie wird dann auch im Kalender nicht mehr zur Auswahl stehen.')) return;
    try{
      await deleteRecipe(state.openRecipeId);
      state.openRecipeId = null; state.editingIngredients = null;
      showToast('Rezeptur gelöscht.');
    }catch(e){ showToast('Fehler beim Löschen: '+(e.message||e), true); }
  };
}

/* ============================= INIT ============================= */
onAuthStateChanged(auth, (user)=>{
  if(user){
    state.authUser = user; state.authError = null; state.authBusy = false;
    if(!state.loaded){ startSync(); }
  } else {
    state.authUser = null; state.loaded = false; stopSync();
  }
  render();
});
render();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(e=>console.warn('Nebenaufgabe fehlgeschlagen (einkaufsliste):', e)); });
}
</script>
</body>
</html>
