<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Red Lotus · Küchenbildschirm</title>
<meta name="theme-color" content="#1c1b1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Küche">
<link rel="manifest" href="manifest-kuechendisplay.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c1b1a; --ink-2:#2a2726; --ink-3:#3a3634;
  --red:#8f1d33; --red-deep:#6b1526; --red-bright:#b02942;
  --gold:#c9a35e; --gold-soft:#e4cf9c; --cream:#f6efe2; --cream-dim:#e9ddc6;
  --ok:#5c8362; --warn:#c9793e;
  --line:rgba(201,163,94,0.18); --shadow:0 10px 30px rgba(0,0,0,0.35);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;background:var(--ink);color:var(--cream);
  font-family:'Work Sans',sans-serif;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.wordmark{font-family:'Marcellus',serif;letter-spacing:0.04em;}
header.top{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 22px;background:linear-gradient(135deg, var(--ink-2), var(--ink-3));
  border-bottom:1px solid var(--line);box-shadow:var(--shadow);
}
.brand{display:flex;align-items:center;gap:14px;}
.brand-mark{
  width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--red-bright), var(--red-deep) 70%);
  border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;
  font-family:'Marcellus',serif;color:var(--gold-soft);font-size:19px;flex-shrink:0;
}
.brand h1{font-size:20px;margin:0;font-weight:600;}
.brand .sub{font-size:12px;color:var(--gold-soft);opacity:0.85;letter-spacing:0.08em;text-transform:uppercase;}
.status-dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);}
.status-dot.off{background:#666;box-shadow:none;}

.board{
  display:grid;grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
  gap:18px;padding:22px;
}
.empty-board{
  grid-column:1/-1;text-align:center;padding:80px 20px;opacity:0.4;font-size:20px;
  font-family:'Marcellus',serif;
}
.order-card{
  background:var(--ink-2);border:1px solid var(--line);border-radius:18px;
  padding:18px 20px 20px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:10px;
  animation:pop .25s ease-out;
}
.order-card.vorbestellung{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,163,94,0.25), var(--shadow);}
@keyframes pop{from{transform:scale(0.94);opacity:0;}to{transform:scale(1);opacity:1;}}
.order-head{display:flex;align-items:baseline;justify-content:space-between;}
.order-number{font-family:'Marcellus',serif;font-size:44px;color:var(--gold-soft);line-height:1;}
.order-mode-tag{font-size:12.5px;font-weight:700;color:var(--cream-dim);opacity:0.85;text-transform:uppercase;letter-spacing:0.03em;}
.order-time{font-size:12.5px;opacity:0.6;}
.vorbestell-badge{
  display:inline-block;background:rgba(201,163,94,0.18);border:1px solid var(--gold);
  color:var(--gold-soft);font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:20px;
  margin-bottom:2px;
}
.order-items{display:flex;flex-direction:column;gap:2px;margin:4px 0;}
.order-item{
  font-size:17px;display:flex;align-items:center;gap:10px;cursor:pointer;
  padding:7px 6px;border-radius:8px;transition:background .12s;
}
.order-item:active{background:rgba(255,255,255,0.06);}
.order-item .item-check{
  width:24px;height:24px;flex-shrink:0;border-radius:7px;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;
}
.order-item.done .item-check{background:var(--ok);border-color:var(--ok);color:#fff;}
.order-item.done .item-label{text-decoration:line-through;opacity:0.5;}
.order-item .item-label{flex:1;}
.order-item .item-box-tag{font-size:11.5px;font-weight:700;color:var(--gold-soft);opacity:0.85;white-space:nowrap;}
.final-btn{
  margin-top:6px;background:var(--red);color:#fff;border:none;padding:14px;border-radius:12px;
  font-size:16px;font-weight:700;cursor:pointer;font-family:'Work Sans',sans-serif;
  letter-spacing:0.02em;
}
.final-btn:active{background:var(--red-bright);}
.final-btn:disabled{opacity:0.5;}
.order-card.ready-glow{
  border-color:var(--ok);box-shadow:0 0 0 3px rgba(92,131,98,0.3), var(--shadow);
}
.order-card.ready-glow .final-btn{background:var(--ok);}
.order-card.ready-glow .final-btn:active{background:#4a6c50;}
.section-title{
  grid-column:1/-1;font-family:'Marcellus',serif;font-size:16px;color:var(--gold-soft);
  opacity:0.75;letter-spacing:0.04em;text-transform:uppercase;font-size:13px;
  margin:6px 0 -6px;padding-left:2px;
}
.reset-btn,.reis-btn{
  background:transparent;border:1px solid var(--line);color:var(--cream);
  padding:8px 14px;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;
  font-family:'Work Sans',sans-serif;white-space:nowrap;
}
.reset-btn:hover,.reis-btn:hover{border-color:var(--gold);}
.reis-btn.active{background:var(--warn);border-color:var(--warn);color:#1c1b1a;}
.head-right{display:flex;align-items:center;gap:10px;}
.reis-banner{
  display:none;align-items:center;justify-content:space-between;gap:14px;
  background:var(--warn);color:#1c1b1a;padding:12px 22px;font-weight:800;font-size:16px;
  cursor:pointer;
}
.reis-banner.show{display:flex;}
.reis-banner button{
  background:#1c1b1a;color:#fff;border:none;padding:8px 14px;border-radius:8px;
  font-size:13px;font-weight:700;cursor:pointer;font-family:'Work Sans',sans-serif;
}
.pending-panel{
  background:rgba(201,163,94,0.08);border-bottom:1px solid var(--line);padding:14px 22px;
}
.pending-panel-title{
  font-size:12.5px;color:var(--gold-soft);opacity:0.8;margin-bottom:10px;
}
.pending-list{display:flex;flex-wrap:wrap;gap:10px;}
.pending-card{
  background:var(--ink-2);border:1px solid var(--gold);border-radius:12px;
  padding:8px 14px;font-size:13.5px;min-width:180px;
}
.pending-card .pc-num{font-family:'Marcellus',serif;color:var(--gold-soft);font-size:18px;margin-right:6px;}
.pending-card .pc-time{opacity:0.7;font-size:12px;}
.pending-card .pc-items{opacity:0.75;font-size:12px;margin-top:2px;}

/* Mobile (Handy hochkant) */
@media (max-width:600px){
  header.top{padding:12px 14px;flex-wrap:wrap;gap:8px;}
  .brand h1{font-size:17px;}
  .brand-mark{width:36px;height:36px;font-size:15px;}
  .board{grid-template-columns:1fr;gap:12px;padding:12px;}
  .order-number{font-size:36px;}
  .order-item{font-size:15px;}
  .final-btn{padding:12px;font-size:14.5px;}
  .reset-btn,.reis-btn{font-size:11.5px;padding:7px 10px;}
}

/* Tablet Querformat: mehr Spalten, etwas kompakter */
@media (min-width:601px) and (max-width:1180px) and (orientation:landscape){
  .board{grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));gap:14px;padding:16px;}
  .order-number{font-size:38px;}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="brand-mark">RL</div>
    <div>
      <h1 class="wordmark">Red Lotus</h1>
      <div class="sub">Küchenbildschirm</div>
    </div>
  </div>
  <div class="head-right">
    <button type="button" class="reset-btn" id="pendingToggleBtn" style="display:none;">🕒 Vorbestellungen (0)</button>
    <button type="button" class="reis-btn" id="reisBtn">🍚 REIS!</button>
    <button type="button" class="reset-btn" id="resetSessionBtn">🔄 Neue Session</button>
    <span class="status-dot off" id="statusDot" title="Verbindung"></span>
  </div>
</header>
<div class="reis-banner" id="reisBanner">
  <span>🍚 REIS IST ALLE!</span>
  <button type="button" id="reisClearBtn">✓ Nachgefüllt</button>
</div>
<div class="pending-panel" id="pendingPanel" style="display:none;">
  <div class="pending-panel-title">Noch nicht freigegebene Vorbestellungen — erscheinen hier erst als aktiver Auftrag, sobald sie im Preisrechner freigegeben werden</div>
  <div id="pendingList"></div>
</div>
<div class="board" id="board">
  <div class="empty-board">Warte auf Bestellungen …</div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js';
import {
  getFirestore, collection, query, where, onSnapshot, doc, updateDoc, setDoc
} from 'https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyA0y6NWpF3N7241mA72Cj-gU_pvbqpNdD4",
  authDomain: "red-lotus-eventkalender.firebaseapp.com",
  projectId: "red-lotus-eventkalender",
  storageBucket: "red-lotus-eventkalender.firebasestorage.app",
  messagingSenderId: "864967561482",
  appId: "1:864967561482:web:98ee51f304748e511f2af3"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp, "default");

// TODO nach dem Deploy der Function "resetOrders" die URL prüfen (Firebase
// gibt sie beim Deploy aus) — gleiches Muster wie bei createOrder.
const RESET_ORDERS_URL = "https://us-central1-red-lotus-eventkalender.cloudfunctions.net/resetOrders?key=rl_wix_h7k2m9p4";

let knownIds = new Set();
let firstLoad = true;
let showPending = false;

// Vorbestellungen sollen den Küchenscreen nicht schon Stunden vor Abholung
// zumüllen: sie werden erst dann Teil des Hauptboards, wenn "released"
// true ist (Default bei Anlage: false für Vorbestellungen, true sonst —
// siehe createOrder in functions/index.js). Felix setzt released im
// Preisrechner manuell, sobald der Kunde tatsächlich da ist/sich meldet.
function isVisibleOnBoard(o){
  return o.released !== false;
}

function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtEUR(n){ return (n||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €'; }
function fmtTime(iso){
  if(!iso) return '';
  try{ return new Date(iso).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return ''; }
}

// Kurzer Signalton bei neuer Bestellung — per Web Audio API erzeugt,
// keine externe Audiodatei nötig.
let audioCtx = null;
function playBeep(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = 880;
    g.gain.value = 0.001;
    o.connect(g); g.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    g.gain.exponentialRampToValueAtTime(0.25, now + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    o.start(now);
    o.stop(now + 0.4);
    // Zweiter, höherer Ton kurz danach für einen deutlichen "Ding-Dong".
    const o2 = audioCtx.createOscillator();
    const g2 = audioCtx.createGain();
    o2.type = 'sine';
    o2.frequency.value = 1320;
    g2.gain.value = 0.001;
    o2.connect(g2); g2.connect(audioCtx.destination);
    g2.gain.exponentialRampToValueAtTime(0.22, now + 0.22);
    g2.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
    o2.start(now + 0.2);
    o2.stop(now + 0.6);
  }catch(e){ console.warn('Signalton konnte nicht abgespielt werden:', e); }
}
// Browser verlangen eine erste Nutzer-Interaktion, bevor Ton erlaubt ist —
// beim ersten Tippen auf den Bildschirm den AudioContext "freischalten".
document.body.addEventListener('click', ()=>{
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
}, { once:true });

// Jedes Gericht einzeln abhakbar (Suki/Prang/Kochstation tippen an, sobald
// fertig). Erst wenn ALLE Positionen einer Bestellung abgehakt sind, hebt
// sich die Karte hervor — dann kommt der finale "Ausgegeben"-Button, den
// nur Felix bei der tatsächlichen Übergabe drückt.
function orderCardHtml(o){
  const items = o.items || [];
  const allDone = items.length > 0 && items.every(it => it.done);
  const allEigene = items.length > 0 && items.every(it => it.box === 'eigene');
  const dineLabel = o.dineMode === 'hier' ? 'zum Hier essen' : 'To-Go';
  const modeTag = dineLabel + (allEigene ? ' · eigene Box' : '');
  return `
    <div class="order-card ${o.isVorbestellung ? 'vorbestellung' : ''} ${allDone ? 'ready-glow' : ''}">
      ${o.isVorbestellung ? `<div class="vorbestell-badge">🕒 Vorbestellung ${escapeHtml(o.pickupTime||'')}</div>` : ''}
      <div class="order-head">
        <div>
          <div class="order-number">#${o.number}</div>
          <div class="order-mode-tag">${escapeHtml(modeTag)}</div>
        </div>
        <div class="order-time">${fmtTime(o.createdAt)}</div>
      </div>
      <div class="order-items">
        ${items.map((it, idx) => `
          <div class="order-item ${it.done ? 'done' : ''}" data-toggle-item="${o.id}" data-item-idx="${idx}">
            <span class="item-check">${it.done ? '✓' : ''}</span>
            <span class="item-label">${escapeHtml(it.label||'Position')}</span>
            ${it.box === 'eigene' && !allEigene ? `<span class="item-box-tag">🥡 eigene Box</span>` : ''}
          </div>`).join('')}
      </div>
      <button type="button" class="final-btn" data-final="${o.id}">✓ Ausgegeben</button>
    </div>`;
}

function pendingCardHtml(o){
  const items = o.items || [];
  return `
    <div class="pending-card">
      <span class="pc-num">#${o.number}</span>
      <span class="pc-time">🕒 ${escapeHtml(o.pickupTime||'—')}</span>
      <div class="pc-items">${escapeHtml(items.map(it=>it.label||'Position').join(', '))}</div>
    </div>`;
}

function renderPendingPanel(allOrders){
  const pending = allOrders.filter(o => o.status === 'offen' && o.isVorbestellung && !isVisibleOnBoard(o))
    .sort((a,b)=> (a.pickupTime||'').localeCompare(b.pickupTime||''));
  const toggleBtn = document.getElementById('pendingToggleBtn');
  const panel = document.getElementById('pendingPanel');
  const list = document.getElementById('pendingList');

  if(!pending.length){
    toggleBtn.style.display = 'none';
    panel.style.display = 'none';
    list.innerHTML = '';
    return;
  }
  toggleBtn.style.display = 'inline-block';
  toggleBtn.textContent = `🕒 Vorbestellungen (${pending.length})`;
  panel.style.display = showPending ? 'block' : 'none';
  list.innerHTML = `<div class="pending-list">${pending.map(o => pendingCardHtml(o)).join('')}</div>`;
}

function render(orders){
  const board = document.getElementById('board');
  const offen = orders.filter(o => o.status === 'offen' && isVisibleOnBoard(o)).sort((a,b)=> (a.number||0) - (b.number||0));

  renderPendingPanel(orders);

  if(!offen.length){
    board.innerHTML = '<div class="empty-board">Warte auf Bestellungen …</div>';
    return;
  }

  board.innerHTML = offen.map(o => orderCardHtml(o)).join('');

  // Position antippen -> abhaken/zurücknehmen (schreibt die komplette
  // items-Liste des jeweiligen Auftrags zurück).
  board.querySelectorAll('[data-toggle-item]').forEach(row=>{
    row.onclick = async ()=>{
      const order = offen.find(o => o.id === row.dataset.toggleItem);
      if(!order) return;
      const idx = parseInt(row.dataset.itemIdx, 10);
      const newItems = (order.items||[]).map((it,i)=> i===idx ? { ...it, done: !it.done } : it);
      try{
        await updateDoc(doc(db, 'orders', order.id), { items: newItems });
      }catch(e){
        console.error('Konnte Position nicht aktualisieren:', e);
      }
    };
  });

  board.querySelectorAll('[data-final]').forEach(btn=>{
    btn.onclick = async (ev)=>{
      ev.stopPropagation();
      const order = offen.find(o => o.id === btn.dataset.final);
      const items = (order && order.items) || [];
      const allDone = items.length > 0 && items.every(it => it.done);
      if(!allDone && !confirm('Noch nicht alle Positionen abgehakt — trotzdem als ausgegeben markieren?')) return;
      btn.disabled = true;
      btn.textContent = '…';
      try{
        await updateDoc(doc(db, 'orders', btn.dataset.final), {
          status: 'fertig',
          readyAt: new Date().toISOString()
        });
      }catch(e){
        console.error('Konnte Bestellung nicht als ausgegeben markieren:', e);
        btn.disabled = false;
        btn.textContent = '✓ Ausgegeben';
      }
    };
  });
}

const q = query(collection(db, 'orders'), where('status', '==', 'offen'));
onSnapshot(q, (snap) => {
  document.getElementById('statusDot').classList.remove('off');
  const orders = [];
  // knownIds verfolgt nur die auf dem Hauptboard SICHTBAREN Bestellungen —
  // so löst sowohl eine neue Sofortbestellung ALS AUCH eine gerade im
  // Preisrechner freigegebene Vorbestellung den Signalton aus, aber eine
  // neu eintreffende (noch unsichtbare) Vorbestellung nicht.
  const currentVisibleIds = new Set();
  snap.forEach(d => {
    const data = d.data();
    orders.push({ id: d.id, ...data });
    if(isVisibleOnBoard(data)) currentVisibleIds.add(d.id);
  });

  if(!firstLoad){
    let hasNew = false;
    currentVisibleIds.forEach(id => { if(!knownIds.has(id)) hasNew = true; });
    if(hasNew) playBeep();
  }
  knownIds = currentVisibleIds;
  firstLoad = false;

  render(orders);
}, (err) => {
  console.error('Küchenbildschirm: Verbindung zu Firestore fehlgeschlagen:', err);
  document.getElementById('statusDot').classList.add('off');
});

const pendingToggleBtn = document.getElementById('pendingToggleBtn');
if(pendingToggleBtn) pendingToggleBtn.onclick = ()=>{
  showPending = !showPending;
  document.getElementById('pendingPanel').style.display = showPending ? 'block' : 'none';
};

// "Neue Session" — archiviert alle offenen/fertigen Bestellungen und setzt
// die Nummerierung wieder auf 1 zurück (z. B. wenn ein Markt/Verkauf vorbei ist).
const resetSessionBtn = document.getElementById('resetSessionBtn');
if(resetSessionBtn) resetSessionBtn.onclick = async ()=>{
  if(!confirm('Neue Session starten? Alle aktuell offenen und fertigen Bestellungen werden ausgeblendet, die Nummerierung startet wieder bei 1.')) return;
  resetSessionBtn.disabled = true;
  resetSessionBtn.textContent = '…';
  try{
    const res = await fetch(RESET_ORDERS_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    const data = await res.json();
    if(!data || !data.ok){
      alert('Zurücksetzen fehlgeschlagen: ' + (data && data.error || 'unbekannter Fehler'));
    }
  }catch(err){
    alert('Zurücksetzen fehlgeschlagen — bitte Internetverbindung prüfen. (' + err.message + ')');
  }
  resetSessionBtn.disabled = false;
  resetSessionBtn.textContent = '🔄 Neue Session';
};

// REIS!-Alarm: gemeinsames Signal mit dem Preisrechner-Tablet. Jede Station
// kann den Alarm auslösen oder quittieren, kein Login nötig.
const reisBtn = document.getElementById('reisBtn');
const reisBanner = document.getElementById('reisBanner');
const reisClearBtn = document.getElementById('reisClearBtn');
onSnapshot(doc(db, 'alerts', 'reis'), (snap) => {
  const active = snap.exists() && snap.data().active;
  reisBanner.classList.toggle('show', !!active);
  reisBtn.classList.toggle('active', !!active);
}, (err) => console.error('REIS-Alarm: Verbindung fehlgeschlagen:', err));

if(reisBtn) reisBtn.onclick = async ()=>{
  try{ await setDoc(doc(db, 'alerts', 'reis'), { active: true, activatedAt: new Date().toISOString() }); }
  catch(e){ console.error('REIS-Alarm konnte nicht ausgelöst werden:', e); }
};
if(reisClearBtn) reisClearBtn.onclick = async (ev)=>{
  ev.stopPropagation();
  try{ await setDoc(doc(db, 'alerts', 'reis'), { active: false }, { merge: true }); }
  catch(e){ console.error('REIS-Alarm konnte nicht quittiert werden:', e); }
};

// Bildschirm wach halten, solange die Seite offen ist (falls vom Browser unterstützt).
if('wakeLock' in navigator){
  const requestWakeLock = async () => {
    try{ await navigator.wakeLock.request('screen'); }
    catch(e){ console.warn('Wake Lock nicht verfügbar:', e); }
  };
  requestWakeLock();
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible') requestWakeLock();
  });
}

// Service Worker registrieren — nötig, damit Chrome/Android "App
// installieren" statt nur "Verknüpfung hinzufügen" anbietet.
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw-kuechendisplay.js').catch(err=>{
    console.warn('Service Worker konnte nicht registriert werden:', err);
  });
}
</script>
</body>
</html>
