     3. gesturestart abfangen (iOS-Safari-Pinch) -->
<style>
/* Feste App-Ansicht auf dem Handy:
   - touch-action: Scrollen ja, Pinch-Zoom nein
   - overflow-x: kein seitliches Verrutschen, falls doch mal etwas übersteht

     statt von ihr überlagert zu werden (Home-Bildschirm-App, black-translucent) */
html,body{touch-action:pan-x pan-y;overflow-x:hidden;}
body{padding-top:env(safe-area-inset-top,0px);}
</style>

<meta name="theme-color" content="#1c1b1a">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --ink:#1c1b1a; --ink-2:#2a2726; --ink-3:#3a3634;
  --red:#8f1d33; --red-deep:#6b1526; --red-bright:#b02942;
  --gold:#c9a35e; --gold-soft:#e4cf9c; --cream:#f6efe2; --cream-dim:#e9ddc6;
  --line:rgba(201,163,94,0.28); --ok:#5c8362; --warn:#c9793e;
  --shadow:0 12px 32px rgba(0,0,0,0.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(143,29,51,0.25), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(201,163,94,0.12), transparent 55%),
    var(--ink);
  color:var(--cream);
  font-family:'Work Sans',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.wordmark{font-family:'Marcellus',serif;letter-spacing:0.04em;}
.app{max-width:900px;margin:0 auto;padding:20px 16px 80px;}
header.top{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-radius:16px;
  background:linear-gradient(135deg, var(--ink-2), var(--ink-3));
  border:1px solid var(--line);box-shadow:var(--shadow);
  margin-bottom:18px;gap:12px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{
  width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--red-bright), var(--red-deep) 70%);
  border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;
  font-family:'Marcellus',serif;color:var(--gold-soft);font-size:20px;flex-shrink:0;
}
.brand h1{font-size:19px;margin:0;font-weight:600;}
.brand .sub{font-size:11.5px;color:var(--gold-soft);opacity:0.85;letter-spacing:0.08em;text-transform:uppercase;}
nav.suite-nav{display:flex;gap:6px;flex-wrap:wrap;}
nav.suite-nav a{
  text-decoration:none;color:var(--cream);border:1px solid var(--line);
  padding:7px 12px;border-radius:9px;font-size:12.5px;font-weight:600;white-space:nowrap;
}
nav.suite-nav a:hover{border-color:var(--gold);}
nav.suite-nav a.active{background:var(--red);border-color:var(--red-bright);color:#fff;}
button{font-family:'Work Sans',sans-serif;}
.btn{
  background:var(--red);color:#fff;border:none;padding:9px 14px;border-radius:9px;
  cursor:pointer;font-size:13px;font-weight:600;letter-spacing:0.01em;transition:background .15s;
}
.btn:hover{background:var(--red-bright);}
.btn.gold{background:var(--gold);color:var(--ink);}
.btn.gold:hover{background:var(--gold-soft);}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--cream);}
.btn.ghost:hover{border-color:var(--gold);}
.btn.danger{background:transparent;border:1px solid var(--red);color:#e79aa7;}
.btn.danger:hover{background:var(--red);color:#fff;}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:7px;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.panel{
  background:var(--ink-2);border:1px solid var(--line);border-radius:16px;
  padding:20px;margin-top:18px;box-shadow:var(--shadow);
}
.panel h3{font-family:'Marcellus',serif;font-size:19px;margin:0 0 14px;font-weight:400;color:var(--gold-soft);}
.hint{font-size:11.5px;color:var(--cream);opacity:0.55;margin-top:4px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--gold-soft);margin-bottom:5px;opacity:0.9;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
@media (max-width:640px){.field-row,.field-row3{grid-template-columns:1fr;}}
select,input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=month]{
  width:100%;background:var(--ink);border:1px solid var(--line);color:var(--cream);
  padding:8px 10px;border-radius:9px;font-size:13.5px;font-family:'Work Sans',sans-serif;
}
input:focus,select:focus{outline:none;border-color:var(--gold);}
.lohn-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.lohn-row label{width:110px;font-size:13px;color:var(--cream);flex-shrink:0;}
.lohn-row input{width:110px;}
.sub-title{font-size:12px;text-transform:uppercase;letter-spacing:0.05em;color:var(--gold-soft);margin:12px 0 8px;opacity:0.85;}
.sub-title:first-child{margin-top:0;}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:6px;}
.table-scroll table.dish-table{margin-top:0;min-width:480px;}
#scenarios table.dish-table{min-width:0;}
#scenarios th,#scenarios td{padding:6px 5px;}
table.dish-table{width:100%;border-collapse:collapse;margin-top:6px;}
table.dish-table th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;
  color:var(--gold-soft);opacity:0.8;padding:6px 8px;border-bottom:1px solid var(--line);
}
table.dish-table td{padding:7px 8px;font-size:13px;border-bottom:1px solid rgba(255,255,255,0.05);}
.total-row td{font-weight:700;font-size:14px;padding-top:10px;color:var(--gold-soft);}
.icon-btn{background:none;border:none;color:var(--gold-soft);opacity:0.6;cursor:pointer;font-size:13px;padding:2px 4px;}
.icon-btn:hover{opacity:1;}
#printArea{position:fixed;inset:0;background:#fff;z-index:9999;overflow:auto;padding:40px;display:none;}
#printArea.show{display:block;}
.rl-print-header{display:flex;align-items:center;gap:16px;border-bottom:3px solid #8f1d33;padding-bottom:14px;margin-bottom:20px;}
.rl-print-logo{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b02942,#6b1526 70%);border:2px solid #c9a35e;flex-shrink:0;}
.rl-print-logo img{width:100%;height:100%;border-radius:50%;object-fit:cover;}
.rl-print-header h1{font-family:'Marcellus',serif;color:#6b1526;margin:0;font-size:22px;}
.rl-print-header .sub{font-size:12px;color:#8f1d33;text-transform:uppercase;letter-spacing:0.08em;}
.print-body{color:#1c1b1a;font-family:'Work Sans',sans-serif;max-width:800px;margin:0 auto;}
.print-body table{width:100%;border-collapse:collapse;margin:14px 0;}
.print-body th{background:#f6efe2;color:#6b1526;text-align:left;padding:8px 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:0.04em;border-bottom:2px solid #c9a35e;}
.print-body td{padding:8px 10px;border-bottom:1px solid #e9ddc6;font-size:13px;}
.print-meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;margin-bottom:16px;font-size:13px;}
.print-meta-grid div b{color:#6b1526;}
.print-toolbar{display:flex;justify-content:flex-end;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.print-footnote{font-size:11px;color:#7a746a;margin-top:24px;border-top:1px solid #e9ddc6;padding-top:10px;}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{position:absolute;inset:0;padding:0;display:block !important;}
  .print-toolbar{display:none !important;}
  .app{display:none !important;}
}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:90vh;padding:20px;}
.login-card{
  background:var(--ink-2);border:1px solid var(--line);border-radius:18px;
  padding:32px 28px;max-width:360px;width:100%;text-align:center;box-shadow:var(--shadow);
}
.login-card .sub{font-size:12px;color:var(--gold-soft);opacity:0.8;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:22px;}
.login-error{background:rgba(130,33,17,0.3);border:1px solid #822111;color:#f2a78e;padding:9px 12px;border-radius:9px;font-size:12.5px;margin-bottom:14px;}
.login-hint{font-size:11.5px;opacity:0.5;margin-top:14px;}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty-state{opacity:0.5;text-align:center;padding:24px 12px;font-size:13px;}
/* ---------- Kalkulation ---------- */
.result-hero{
  border-radius:14px;padding:18px;margin-bottom:14px;text-align:center;
  border:1px solid var(--line);background:var(--ink);
}
.result-hero .big{font-family:'Marcellus',serif;font-size:40px;line-height:1.1;}
.result-hero .lbl{font-size:11px;text-transform:uppercase;letter-spacing:0.07em;color:var(--gold-soft);opacity:0.85;}
.result-hero .verdict{font-size:13px;margin-top:6px;font-weight:600;}
.result-hero.good{border-color:var(--ok);background:rgba(92,131,98,0.18);}
.result-hero.mid{border-color:var(--warn);background:rgba(201,121,62,0.16);}
.result-hero.bad{border-color:var(--red-bright);background:rgba(143,29,51,0.25);}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.kpi{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
.kpi .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--gold-soft);opacity:0.8;}
.kpi .val{font-size:18px;font-weight:700;margin-top:2px;}
.kpi .sub{font-size:11px;opacity:0.6;margin-top:2px;}
table.calc{width:100%;border-collapse:collapse;}
table.calc td{padding:6px 4px;font-size:13px;border-bottom:1px solid rgba(255,255,255,0.05);}
table.calc td.num{text-align:right;white-space:nowrap;}
table.calc tr.sum td{font-weight:700;color:var(--gold-soft);border-top:1px solid var(--line);}
table.calc tr.minus td:first-child{opacity:0.85;}
.rate-good{color:#9fd3a8;font-weight:700;}
.rate-mid{color:#f0b07a;font-weight:700;}
.rate-bad{color:#f2a0b0;font-weight:700;}
details.settings summary{cursor:pointer;font-family:'Marcellus',serif;font-size:19px;color:var(--gold-soft);list-style:none;}
details.settings summary::-webkit-details-marker{display:none;}
details.settings summary::after{content:' ▾';font-size:14px;opacity:0.6;}
details.settings[open] summary::after{content:' ▴';}
.saved-flag{font-size:11px;color:#9fd3a8;opacity:0;transition:opacity .3s;margin-left:8px;}
.saved-flag.show{opacity:1;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
</style>
</head>

// Gleiche Regeln wie in index.html (NEBENKOSTEN / eventDishTotal) — bei
// Änderungen dort bitte hier nachziehen.
const NEBENKOSTEN = {'Foodtruckcatering':{type:'flat',value:700},'Buffet':{type:'flat',value:550},'Minibuffet mit Lieferung':{type:'perPerson',value:2}};
function computeNebenkosten(art,people,overrideVal){
  if(overrideVal!==null && overrideVal!==undefined && overrideVal!=='null') return parseFloat(overrideVal)||0;
  const rule = NEBENKOSTEN[art];
  if(!rule) return 0;
  if(rule.type==='flat') return rule.value;
  if(rule.type==='perPerson') return rule.value*(parseFloat(people)||0);
  return 0;
}

  return (evt.dishes||[]).reduce((s,d)=>s+((+d.unitPrice||0)*(+d.qty||0)*(+d.factor||1)),0);

    ['zielLohn','Ziel-Stundenlohn Nebensaison','€','',1],
    ['zielLohnSaison','Ziel-Stundenlohn Hauptsaison','€','',1],
    ['minLohn','Deine Untergrenze','€','',1],
  ]]
];

function escapeHtml(s){
  return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtEUR(n){ return (Number(n)||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'}); }
function fmtNum(n,d=1){ return (Number(n)||0).toLocaleString('de-DE',{maximumFractionDigits:d}); }
function num(v,fallback=0){ const x = parseFloat(String(v).replace(',','.')); return isNaN(x)?fallback:x; }
function roundUpHalf(x){ return Math.ceil(x*2)/2; }
function todayISO(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }

const state = {
  authUser:null, authBusy:false, authError:null,
  loaded:false, settings:{...DEFAULTS}, events:[],
  input:{ eventId:'', datum:todayISO(), gaeste:60, km:35, grundpreis:'', extras:'', nebenkosten:DEFAULTS.nebenkostenStandard,
          gerichte:2, premium:0, rabatt:'', porzellan:false, anzahlung:true, stdFelix:null, stdPearl:null, minijob:null }
};
let unsubSettings=null, unsubEvents=null, saveTimer=null;

/* ============================= RECHNUNG ============================= */
function S(k){
  if(k==='bedingungen'){ const v = state.settings.bedingungen; return (v==null||v==='') ? DEFAULTS.bedingungen : v; }
  return num(state.settings[k], DEFAULTS[k]);
}
function staffelPreis(g){ return g >= S('staffel3Ab') ? S('staffel3Preis') : (g >= S('staffel2Ab') ? S('staffel2Preis') : S('staffel1Preis')); }
function extraGerichte(n){ return Math.max(0, n - S('gerichteInklusive')); }
function aufpreiseProKopf(p){ return extraGerichte(p.gerichte)*S('aufpreisGericht') + p.premium*S('premiumAufpreis'); }
function autoHours(g, gerichte){ return S('stundenBasis') + S('stundenProGast')*g + extraGerichte(gerichte)*S('stundenProGericht'); }
function autoMinijob(g){ return g >= S('minijobAb') ? S('minijobStunden') : 0; }
function istHauptsaison(datumISO){
  const m = datumISO ? new Date(datumISO+'T00:00:00').getMonth()+1 : new Date().getMonth()+1;
  const von = S('saisonVon'), bis = S('saisonBis');
  return von <= bis ? (m>=von && m<=bis) : (m>=von || m<=bis);
}
function zielFuer(p){ return p.hauptsaison ? S('zielLohnSaison') : S('zielLohn'); }

// Kosten, die nicht vom Verkaufspreis abhängen (alles netto).
function kostenVon(p){
  const g = Math.max(0, p.gaeste);
  const ware = g*S('portionenProGast')*S('wareJePortion') + g*p.premium*S('premiumMehrkosten') + (p.extras/1.07)*S('extrasWareQuote')/100;
  const geschirr = g * (p.porzellan ? S('porzellanKosten') : S('einwegKosten'));
  const fahrt = p.km * 2 * S('kmSatz');
  const sonst = S('sonstiges');
  const pearl = p.stdPearl * S('pearlKosten');
  const minijob = p.minijob * S('minijobKosten');
  const fix = S('fixProTag');
  return { ware, geschirr, fahrt, sonst, pearl, minijob, fix, summe: ware+geschirr+fahrt+sonst+pearl+minijob+fix };
}
function zuschlaege(p){
  const porzellan = p.porzellan ? Math.max(0,p.gaeste)*S('porzellanAufpreis') : 0;
  const mehrKm = Math.max(0, p.km - S('anfahrtFreiKm'));
  const anfahrt = p.legacy ? 0 : mehrKm*2*S('anfahrtProKm'); // alte Angebote kannten keinen Anfahrtszuschlag
  return { porzellan, mehrKm, anfahrt };
}
// Gleiche Logik wie computeOffer() im Kalender (Positionen brutto, alles 7 %).
function calc(p){
  const g = Math.max(0, p.gaeste);
  const basis = p.grundpreis==null ? staffelPreis(g) : p.grundpreis;
  const proKopf = basis + aufpreiseProKopf(p);
  const speisenVorRabatt = g*proKopf + p.extras;
  const rabattBetrag = Math.round(speisenVorRabatt*p.rabatt)/100;
  const nachRabatt = speisenVorRabatt - rabattBetrag;
  const mindestAktiv = !p.legacy && g>0 && nachRabatt < S('mindestumsatz');
  const speisen = mindestAktiv ? S('mindestumsatz') : nachRabatt;
  const z = zuschlaege(p);
  const bruttoGesamt = speisen + z.porzellan + z.anfahrt + p.nebenkosten;
  const umsatzNetto = bruttoGesamt/1.07;
  const k = kostenVon(p);
  const felix = umsatzNetto - k.summe;
  const lohn = p.stdFelix > 0 ? felix/p.stdFelix : 0;
  const anzahlung = p.anzahlung ? bruttoGesamt*S('anzahlungPct')/100 : 0;
  return { g, basis, proKopf, speisenVorRabatt, rabattBetrag, nachRabatt, mindestAktiv, speisen, ...z, bruttoGesamt, umsatzNetto,
           k, felix, lohn, anzahlung, proKopfAllIn: g>0 ? bruttoGesamt/g : 0 };
}
// Grundpreis p. P. (brutto, für die inklusiven Hauptgerichte), bei dem Felix
// genau zielLohnWert je Stunde verdient. Mindestumsatz wird separat angezeigt.
function preisFuerLohn(p, zielLohnWert){
  if(p.gaeste<=0) return 0;
  const k = kostenVon(p), z = zuschlaege(p);
  const bruttoNoetig = (zielLohnWert*p.stdFelix + k.summe) * 1.07;
  const speisenNoetig = bruttoNoetig - z.porzellan - z.anfahrt - p.nebenkosten;
  const vorRabatt = speisenNoetig / Math.max(0.01, 1 - p.rabatt/100);
  return Math.max(0, (vorRabatt - p.extras)/p.gaeste - aufpreiseProKopf(p));
}
function rateClass(l, ziel){ return l >= ziel ? 'good' : (l >= S('minLohn') ? 'mid' : 'bad'); }
function currentParams(){
  const i = state.input, g = num(i.gaeste), gerichte = Math.max(1, Math.round(num(i.gerichte,2)));
  const premium = Math.min(gerichte, Math.max(0, Math.round(num(i.premium,0))));
  const auto = autoHours(g, gerichte);
  const gp = String(i.grundpreis??'').trim();
  return {
    gaeste: g, km: num(i.km), grundpreis: gp==='' ? null : num(gp), extras: num(i.extras), nebenkosten: num(i.nebenkosten),
    gerichte, premium, rabatt: Math.min(100, Math.max(0, num(i.rabatt))), porzellan: !!i.porzellan, anzahlung: i.anzahlung!==false,
    hauptsaison: istHauptsaison(i.datum), legacy: !!i.legacy,
    stdFelix: i.stdFelix==null || i.stdFelix==='' ? auto : num(i.stdFelix),
    stdPearl: i.stdPearl==null || i.stdPearl==='' ? auto : num(i.stdPearl),
    minijob: i.minijob==null || i.minijob==='' ? autoMinijob(g) : num(i.minijob),
    autoStd: auto, autoMini: autoMinijob(g)
  };
}

function mapAuthError(e){
  const code = e && e.code || '';
  if(code.includes('invalid-credential') || code.includes('wrong-password') || code.includes('user-not-found')) return 'E-Mail oder Passwort ist falsch.';
  if(code.includes('popup-closed-by-user') || code.includes('cancelled-popup-request')) return 'Google-Anmeldung abgebrochen.';
  if(code.includes('popup-blocked')) return 'Der Anmelde-Pop-up wurde blockiert. Bitte Pop-ups erlauben.';
  return 'Anmeldung fehlgeschlagen: '+(e.message||e);
}
function attachLoginHandlers(){
  const doLogin = async ()=>{
    const email = document.getElementById('login-email').value.trim();
    const pass = document.getElementById('login-pass').value;
    if(!email || !pass){ state.authError='Bitte E-Mail und Passwort eingeben.'; render(); return; }
    state.authBusy=true; state.authError=null; render();
    try{ await signInWithEmailAndPassword(auth, email, pass); }
    catch(e){ state.authBusy=false; state.authError=mapAuthError(e); render(); }
  };
  document.getElementById('loginBtn').onclick = doLogin;
  document.getElementById('googleLoginBtn').onclick = async ()=>{
    state.authBusy=true; state.authError=null; render();
    try{ await signInWithPopup(auth, googleProvider); }
    catch(e){ state.authBusy=false; state.authError=mapAuthError(e); render(); }
  };
}

/* ============================= DATEN ============================= */
function startSync(){
  let sReady=false, eReady=false;
  const done = ()=>{ if(sReady && eReady && !state.loaded){ state.loaded=true; state.input.nebenkosten = S('nebenkostenStandard'); render(); } };
  unsubSettings = onSnapshot(doc(db,'settings','kalkulation'), d=>{
    state.settings = {...DEFAULTS, ...(d.exists()?d.data():{})};
    sReady=true; if(state.loaded) updateResults(); done();
  }, err=>{ console.error('Firestore (settings/kalkulation):', err); sReady=true; done(); });
  unsubEvents = onSnapshot(collection(db,'events'), snap=>{
    state.events = snap.docs.map(d=>({id:d.id, ...d.data()}))
      .filter(e => (e.category||'event')==='event' && num(e.people)>0)
      .sort((a,b)=> (b.date||'').localeCompare(a.date||''));
    eReady=true; if(state.loaded) refreshEventSelect(); done();
  }, err=>{ console.error('Firestore (events):', err); eReady=true; done(); });
}
function stopSync(){ if(unsubSettings) unsubSettings(); if(unsubEvents) unsubEvents(); }
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      await setDoc(doc(db,'settings','kalkulation'), state.settings);
      const f = document.getElementById('savedFlag');
      if(f){ f.classList.add('show'); setTimeout(()=>f.classList.remove('show'), 1500); }
    }catch(e){ alert('Speichern fehlgeschlagen: '+(e.message||e)); }
  }, 600);
}

function updateResults(){
  const p = currentParams();
  const r = calc(p);
  const ziel = zielFuer(p);
  const cls = rateClass(r.lohn, ziel);
  const verdict = cls==='good' ? 'Über deinem Ziel – gutes Angebot'
                : cls==='mid' ? 'Zwischen Untergrenze und Ziel – okay, aber nachschärfen'
                : 'Unter deiner Untergrenze – so nicht annehmen';
  const aufs = aufpreiseProKopf(p);
  const minGrund = p.gaeste>0 ? ((S('mindestumsatz')/Math.max(0.01,1-p.rabatt/100)) - p.extras)/p.gaeste - aufs : 0;
  const pZielRoh = roundUpHalf(preisFuerLohn(p, ziel)), pMinRoh = roundUpHalf(preisFuerLohn(p, S('minLohn')));
  const pZiel = Math.max(pZielRoh, roundUpHalf(minGrund)), pMin = Math.max(pMinRoh, roundUpHalf(minGrund));

  const set = (id, txt)=>{ const el=document.getElementById(id); if(el) el.textContent = txt; };
  set('autoHint', `Leer lassen = automatisch: ${fmtNum(p.autoStd)} h je Person, Minijob ${fmtNum(p.autoMini)} h.`);
  set('saisonHint', `${p.hauptsaison?'Hauptsaison':'Nebensaison'} – Ziel ${fmtEUR(ziel)}/h`);
  set('staffelHint', `Preisliste: ${fmtEUR(staffelPreis(p.gaeste))} p. P.`);
  ['stdFelix','stdPearl','minijob'].forEach(k=>{
    const el = document.getElementById('in-'+k);
    if(el) el.placeholder = fmtNum(k==='minijob'?p.autoMini:p.autoStd);
  });

  const lines = [];
  lines.push([`${fmtNum(r.g,0)} × ${fmtEUR(r.basis)} ${p.grundpreis==null?'(Preisliste)':'(manuell)'}`, r.g*r.basis]);
  if(extraGerichte(p.gerichte)) lines.push([`Aufpreis ${extraGerichte(p.gerichte)} weiteres Gericht`, r.g*extraGerichte(p.gerichte)*S('aufpreisGericht')]);
  if(p.premium) lines.push([`Aufpreis Rind/Fisch/Seafood (${p.premium})`, r.g*p.premium*S('premiumAufpreis')]);
  if(p.extras) lines.push(['Vorspeisen/Desserts', p.extras]);
  if(r.rabattBetrag) lines.push([`Rabatt ${fmtNum(p.rabatt)} %`, -r.rabattBetrag]);
  if(r.mindestAktiv) lines.push(['Mindestumsatz-Ausgleich', S('mindestumsatz')-r.nachRabatt]);
  if(r.porzellan) lines.push(['Porzellan', r.porzellan]);
  if(r.anfahrt) lines.push([`Anfahrtszuschlag (${fmtNum(r.mehrKm,0)} km × 2)`, r.anfahrt]);
  lines.push(['Nebenkostenpauschale', p.nebenkosten]);

  const mindestBox = r.mindestAktiv ? `
    <div class="login-error" style="text-align:left;margin-bottom:14px;background:rgba(201,121,62,0.16);border-color:var(--warn);color:var(--cream);">
      <b>Mindestumsatz greift:</b> Speisen ${fmtEUR(r.nachRabatt)} liegen unter ${fmtEUR(S('mindestumsatz'))} – der Kunde zahlt ${fmtEUR(S('mindestumsatz')-r.nachRabatt)} Ausgleich.
    </div>` : '';

  document.getElementById('results').innerHTML = `
    <div class="result-hero ${cls}">
      <div class="lbl">Dein Stundenlohn bei diesem Angebot</div>
      <div class="big">${fmtEUR(r.lohn)}</div>
      <div class="verdict">${verdict}</div>
      <div class="hint" style="margin-top:4px;">${p.hauptsaison?'Hauptsaison':'Nebensaison'}: Ziel ${fmtEUR(ziel)} · Untergrenze ${fmtEUR(S('minLohn'))} · vor Steuer &amp; Krankenversicherung</div>
    </div>
    ${mindestBox}
    ${p.legacy ? `<div class="hint" style="margin:-4px 0 12px;">Altes Angebot nach Kartenpreisen geladen – ohne Mindestumsatz, so wie es tatsächlich abgerechnet wird.</div>` : ''}
    <div class="kpis">
      <div class="kpi"><div class="lbl">Kunde zahlt gesamt</div><div class="val">${fmtEUR(r.bruttoGesamt)}</div><div class="sub">= ${fmtEUR(r.proKopfAllIn)} p. P. alles inklusive${r.anzahlung?` · Anzahlung ${fmtEUR(r.anzahlung)}`:''}</div></div>
      <div class="kpi"><div class="lbl">Grundpreis p. P. für dein Ziel</div><div class="val">${fmtEUR(pZiel)}</div><div class="sub">Preisliste: ${fmtEUR(staffelPreis(p.gaeste))} · Untergrenze: ${fmtEUR(pMin)}</div></div>
    </div>
    <div class="sub-title">So steht es im Angebot (brutto)</div>
    <table class="calc">
      ${lines.map(([t,v])=>`<tr><td>${t}</td><td class="num">${fmtEUR(v)}</td></tr>`).join('')}
      <tr class="sum"><td>Gesamt brutto (netto ${fmtEUR(r.umsatzNetto)})</td><td class="num">${fmtEUR(r.bruttoGesamt)}</td></tr>
    </table>
    <div class="sub-title" style="margin-top:14px;">Was davon bei dir bleibt (netto)</div>
    <table class="calc">
      <tr><td>Umsatz netto</td><td class="num">${fmtEUR(r.umsatzNetto)}</td></tr>
      <tr class="minus"><td>− Ware (${fmtNum(S('portionenProGast'))} Portionen × ${fmtEUR(S('wareJePortion'))}${p.premium?' + Rind/Seafood':''}${p.extras?' + Extras':''})</td><td class="num">${fmtEUR(r.k.ware)}</td></tr>
      <tr class="minus"><td>− ${p.porzellan?'Porzellan':'Einweggeschirr'}</td><td class="num">${fmtEUR(r.k.geschirr)}</td></tr>
      <tr class="minus"><td>− Fahrt (${fmtNum(p.km*2,0)} km)</td><td class="num">${fmtEUR(r.k.fahrt)}</td></tr>
      <tr class="minus"><td>− Gas, Strom, Sonstiges</td><td class="num">${fmtEUR(r.k.sonst)}</td></tr>
      <tr class="minus"><td>− Pearl (${fmtNum(p.stdPearl)} h)</td><td class="num">${fmtEUR(r.k.pearl)}</td></tr>
      ${p.minijob>0?`<tr class="minus"><td>− Minijob (${fmtNum(p.minijob)} h)</td><td class="num">${fmtEUR(r.k.minijob)}</td></tr>`:''}
      <tr class="minus"><td>− Anteil Truck/Auto-Fixkosten</td><td class="num">${fmtEUR(r.k.fix)}</td></tr>
      <tr class="sum"><td>Bleibt für dich (${fmtNum(p.stdFelix)} h)</td><td class="num">${fmtEUR(r.felix)}</td></tr>
    </table>`;

  const sizes = [30,50,75,100,150,200,250,300];
  document.getElementById('scenarios').innerHTML = `
    <table class="dish-table">
      <thead><tr><th>Gäste</th><th>Liste</th><th>Kunde zahlt</th><th>Dein Lohn</th><th>Für Ziel</th></tr></thead>
      <tbody>${sizes.map(g=>{
        const h = autoHours(g, p.gerichte);
        const sp = {...p, gaeste:g, grundpreis:null, extras:0, rabatt:0, stdFelix:h, stdPearl:h, minijob:autoMinijob(g)};
        const rr = calc(sp);
        const roh = roundUpHalf(preisFuerLohn(sp, ziel));
        const minG = roundUpHalf(S('mindestumsatz')/g - aufpreiseProKopf(sp));
        const fz = minG > roh ? `<span title="Mindestumsatz greift">${fmtEUR(minG)}*</span>` : fmtEUR(roh);
        return `<tr><td>${g}</td><td>${fmtEUR(staffelPreis(g))}${rr.mindestAktiv?'*':''}</td><td>${fmtEUR(rr.bruttoGesamt)}</td><td class="rate-${rateClass(rr.lohn,ziel)}">${fmtEUR(rr.lohn)}</td><td>${fz}</td></tr>`;
      }).join('')}</tbody>
    </table>
    <div class="hint" style="margin-top:6px;">* Mindestumsatz von ${fmtEUR(S('mindestumsatz'))} greift – Kunde zahlt mindestens diesen Betrag für die Speisen. „Kunde zahlt“ inkl. Pauschale${p.porzellan?', Porzellan':''}${zuschlaege(p).anfahrt?', Anfahrt':''}.</div>`;
}

function loadEvent(id){
  const e = state.events.find(x=>x.id===id);
  state.input.eventId = id || '';
  state.input.legacy = false;
  if(!e){ render(); return; }
  const people = num(e.people);
  const dishes = e.dishes || [];
  const isMain = d => d.category!=='vorspeisen' && d.category!=='desserts';
  const mains = dishes.filter(isMain);
  const extrasSum = dishes.filter(d=>!isMain(d)).reduce((t,d)=>t+(num(d.unitPrice)*num(d.qty)*num(d.factor,1)),0);
  const th = e.teamHours || {};
  const pr = e.preis || {};
  state.input.gaeste = people;
  state.input.datum = e.date || todayISO();
  state.input.gerichte = Math.max(1, mains.length || 2);
  state.input.premium = mains.filter(d=>['Rind','Fisch','Seafood'].includes(d.variant)).length;
  state.input.extras = Math.round(extrasSum*100)/100 || '';
  state.input.nebenkosten = computeNebenkosten(e.art||'Foodtruckcatering', people, e.nebenkostenOverride);
  if(pr.modus==='staffel'){
    state.input.grundpreis = pr.grundpreis ?? '';
    state.input.km = pr.km!==undefined && pr.km!=='' ? num(pr.km) : state.input.km;
    state.input.rabatt = pr.rabatt || '';
    state.input.porzellan = !!pr.porzellan;
    state.input.anzahlung = pr.anzahlung!==false;
  } else {
    // Alte Berechnung: Kartenpreise der Hauptgerichte ergeben den Grundpreis.
    const mainsTotal = mains.reduce((t,d)=>t+(num(d.unitPrice)*num(d.qty)*num(d.factor,1)),0);
    const p0 = {gerichte:state.input.gerichte, premium:state.input.premium};
    state.input.grundpreis = people>0 ? Math.round(Math.max(0, mainsTotal/people - aufpreiseProKopf(p0))*100)/100 : '';
    state.input.rabatt = ''; state.input.porzellan = false; state.input.anzahlung = false;
    state.input.legacy = true; // altes Angebot: kein Mindestumsatz, keine Anzahlung
  }
  state.input.stdFelix = th[FELIX_EMAIL] > 0 ? th[FELIX_EMAIL] : null;
  state.input.stdPearl = th[PEARL_EMAIL] > 0 ? th[PEARL_EMAIL] : null;
  state.input.minijob = null;
  render();
}

function attachAppHandlers(){
  document.getElementById('logoutBtn').onclick = ()=> signOut(auth);
  document.getElementById('in-event').onchange = (ev)=> loadEvent(ev.target.value);
  const map = {'in-datum':'datum','in-gaeste':'gaeste','in-gerichte':'gerichte','in-premium':'premium','in-extras':'extras','in-km':'km',
               'in-grundpreis':'grundpreis','in-neben':'nebenkosten','in-rabatt':'rabatt','in-stdFelix':'stdFelix','in-stdPearl':'stdPearl','in-minijob':'minijob'};
  Object.entries(map).forEach(([id,key])=>{
    const el = document.getElementById(id);
    el.oninput = ()=>{
      const v = el.value.trim();
      state.input[key] = (['stdFelix','stdPearl','minijob'].includes(key) && v==='') ? null : v;
      updateResults();
    };
  });
  document.getElementById('toOfferBtn').onclick = ()=>{
    const i = state.input, p = currentParams();
    const e = i.eventId ? state.events.find(x=>x.id===i.eventId) : null;
    if(e && e.acceptedOffer && !confirm('Für diesen Termin gibt es schon ein angenommenes (eingefrorenes) Angebot. Die Rechnung nutzt weiterhin die eingefrorenen Werte. Trotzdem übernehmen?')) return;
    if(e && !(e.preis && e.preis.modus==='staffel') && !confirm('Dieser Termin wird bisher nach Kartenpreisen berechnet. Beim Speichern wird er auf die Preisliste umgestellt – der Preis kann sich ändern. Weiter?')) return;
    const q = new URLSearchParams({ kalk:'1' });
    if(e) q.set('event', e.id);
    q.set('datum', i.datum || '');
    q.set('gaeste', String(p.gaeste));
    q.set('km', String(p.km));
    if(p.rabatt) q.set('rabatt', String(p.rabatt));
    if(p.grundpreis!=null && !p.legacy) q.set('grundpreis', String(p.grundpreis));
    q.set('porzellan', p.porzellan ? '1' : '0');
    q.set('anzahlung', p.anzahlung ? '1' : '0');
    q.set('neben', String(p.nebenkosten));
    q.set('gerichte', String(p.gerichte));
    q.set('premium', String(p.premium));
    q.set('total', String(Math.round(calc(p).bruttoGesamt*100)/100));
    window.location.href = 'index.html?' + q.toString();
  };
  document.getElementById('in-porzellan').onchange = (ev)=>{ state.input.porzellan = ev.target.checked; updateResults(); };
  document.getElementById('in-anzahlung').onchange = (ev)=>{ state.input.anzahlung = ev.target.checked; updateResults(); };
  document.querySelectorAll('[data-setting]').forEach(el=>{
    el.oninput = ()=>{
      const v = num(el.value, NaN);
      if(isNaN(v)) return;
      state.settings[el.dataset.setting] = v;
      updateResults(); scheduleSave();
    };
  });
  const bed = document.getElementById('set-bedingungen');
  bed.oninput = ()=>{ state.settings.bedingungen = bed.value; scheduleSave(); };
  document.getElementById('resetDefaults').onclick = ()=>{
    if(!confirm('Alle Grundwerte (auch Preisliste und Bedingungen) auf die Startwerte zurücksetzen?')) return;
    state.settings = {...DEFAULTS}; render(); scheduleSave();
  };
}

function render(){
  const app = document.getElementById('app');
  if(!state.authUser){ app.innerHTML = renderLogin(); attachLoginHandlers(); return; }
  if(!state.loaded){ app.innerHTML = `<div class="app"><p class="hint">Lade…</p></div>`; return; }
  app.innerHTML = renderApp();
  attachAppHandlers();
  updateResults();
}

/* ============================= INIT ============================= */
onAuthStateChanged(auth, (user)=>{
  if(user){
    state.authUser = user; state.authError = null; state.authBusy = false;
    if(!state.loaded){ startSync(); }
  } else {
    state.authUser = null; state.loaded = false; stopSync();
  }
  render();
});
render();
</script>
