<style>
:root{
  --ink:#1c1b1a;
  --ink-2:#2a2726;
  --ink-3:#3a3634;
  --red:#8f1d33;
  --red-deep:#6b1526;
  --red-bright:#b02942;
  --gold:#c9a35e;
  --gold-soft:#e4cf9c;
  --cream:#f6efe2;
  --cream-dim:#e9ddc6;
  --ok:#5c8362;
  --warn:#c9793e;
  --line:rgba(201,163,94,0.18);
  --shadow:0 10px 30px rgba(0,0,0,0.35);
}
*{box-sizing:border-box;}
body{
  margin:0;background:var(--ink);color:var(--cream);
  font-family:'Work Sans',sans-serif;-webkit-font-smoothing:antialiased;
}
.app{max-width:520px;margin:0 auto;padding:16px 14px 40px;}
.wordmark{font-family:'Marcellus',serif;letter-spacing:0.04em;}

header.top{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-radius:16px;
  background:linear-gradient(135deg, var(--ink-2), var(--ink-3));
  border:1px solid var(--line);box-shadow:var(--shadow);
  margin-bottom:16px;gap:10px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{
  width:42px;height:42px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--red-bright), var(--red-deep) 70%);
  border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;
  font-family:'Marcellus',serif;color:var(--gold-soft);font-size:18px;flex-shrink:0;
}
.brand h1{font-size:18px;margin:0;font-weight:600;}
.brand .sub{font-size:11px;color:var(--gold-soft);opacity:0.85;letter-spacing:0.08em;text-transform:uppercase;}
a.link-chip{
  color:var(--gold-soft);text-decoration:none;font-size:12px;
  border:1px solid var(--line);padding:7px 12px;border-radius:9px;white-space:nowrap;
}
a.link-chip:hover{border-color:var(--gold);}

.panel{
  background:var(--ink-2);border:1px solid var(--line);border-radius:16px;
  padding:18px;margin-top:14px;box-shadow:var(--shadow);
}
.panel h3{font-family:'Marcellus',serif;font-size:16px;margin:0 0 12px;font-weight:400;color:var(--gold-soft);}
.panel .sub-title{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--gold-soft);opacity:0.7;margin:14px 0 8px;}

/* Summe-Anzeige */
.sum-display{text-align:right;margin-bottom:10px;}
.sum-display .label{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--gold-soft);opacity:0.8;}
.sum-display .amount{font-family:'Marcellus',serif;font-size:38px;color:var(--cream);line-height:1.1;}
.sum-display .amount.zero{opacity:0.35;}

/* Bestellbereich ein-/ausklappen — Umschalter direkt unter den Tabs */
.picker-toggle-row{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-bottom:10px;
}
.picker-toggle-row .picker-status{font-size:12.5px;opacity:0.65;font-weight:600;}
.picker-toggle-row button{
  background:transparent;border:1px solid var(--line);color:var(--gold-soft);
  padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer;font-family:'Work Sans',sans-serif;
}
.picker-toggle-row button:hover{border-color:var(--gold);}

/* Postenliste */
.item-list{display:flex;flex-direction:column;gap:6px;margin:12px 0;max-height:180px;overflow-y:auto;}
.order-panel.picker-collapsed .item-list{max-height:56vh;}
.item-row{
  display:flex;justify-content:space-between;align-items:center;
  background:var(--ink-3);border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;font-size:14px;
}
.item-row .price{font-weight:600;}
.item-row button{
  background:transparent;border:none;color:var(--cream);opacity:0.55;
  font-size:16px;cursor:pointer;padding:2px 6px;line-height:1;
}
.item-row button:hover{opacity:1;color:var(--gold-soft);}
.empty-state{font-size:12.5px;opacity:0.5;text-align:center;padding:10px 0;}

/* Feste Preis-Buttons */
.price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.price-grid .price-btn-wrap{position:relative;}
.price-grid button.price-btn{
  width:100%;background:var(--ink-3);border:1px solid var(--line);color:var(--cream);
  padding:14px 4px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;
  font-family:'Work Sans',sans-serif;transition:background .12s;
}
.price-grid button.price-btn:active{background:var(--red);border-color:var(--red-bright);color:#fff;}
.price-grid .price-btn-del{
  position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;
  background:var(--red);color:#fff;border:2px solid var(--ink-2);font-size:12px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;
}
.manage-row{display:flex;justify-content:flex-end;margin-bottom:10px;}
.manage-row button{
  background:transparent;border:1px solid var(--line);color:var(--gold-soft);
  padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer;font-family:'Work Sans',sans-serif;
}
.manage-row button:hover{border-color:var(--gold);}
.add-price-row{display:flex;gap:8px;margin-top:10px;}
.add-price-row input{
  flex:1;background:var(--ink);border:1px solid var(--line);color:var(--cream);
  padding:10px 12px;border-radius:9px;font-size:14px;font-family:'Work Sans',sans-serif;
}
.add-price-row input:focus{outline:none;border-color:var(--gold);}
.add-price-row button{
  background:var(--gold);color:var(--ink);border:none;padding:0 16px;border-radius:9px;
  font-weight:600;cursor:pointer;font-family:'Work Sans',sans-serif;
}

/* Zifferntastatur (fuer individuelle Betraege) */
.keypad-display{
  background:var(--ink);border:1px solid var(--line);border-radius:12px;
  padding:12px 16px;text-align:right;font-family:'Marcellus',serif;
  font-size:26px;margin-bottom:10px;color:var(--cream);letter-spacing:0.02em;
  overflow-x:auto;white-space:nowrap;
}
.keypad-display .euro{opacity:0.5;font-size:18px;margin-right:4px;}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.keypad button{
  background:var(--ink-3);border:1px solid var(--line);color:var(--cream);
  padding:14px 0;border-radius:10px;font-size:17px;font-weight:600;cursor:pointer;
  font-family:'Work Sans',sans-serif;transition:background .12s;
}
.keypad button:active{background:var(--ink);}
.keypad button.clear{color:#e79aa7;border-color:var(--red);}
.keypad button.clear:active{background:var(--red);color:#fff;}
.keypad button.add{background:var(--gold);color:var(--ink);border-color:var(--gold);grid-row:span 2;font-size:14px;}
.keypad button.add:active{background:var(--gold-soft);}

/* Bezahlt / Wechselgeld */
.cash-shortcuts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.cash-shortcuts button{
  flex:1;min-width:64px;background:var(--ink-3);border:1px solid var(--line);color:var(--cream);
  padding:10px 0;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;
}
.cash-shortcuts button:active{border-color:var(--gold);}
.change-display{text-align:center;padding:16px 0 4px;}
.change-display .label{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--gold-soft);opacity:0.8;}
.change-display .amount{font-family:'Marcellus',serif;font-size:34px;margin-top:2px;}
.change-display .amount.ok{color:var(--gold-soft);}
.change-display .amount.warn{color:#e79aa7;}
.change-display .hint{font-size:12px;opacity:0.6;margin-top:4px;}

.btn{
  background:var(--red);color:#fff;border:none;padding:11px 16px;border-radius:9px;
  cursor:pointer;font-size:13.5px;font-weight:600;letter-spacing:0.01em;width:100%;
  font-family:'Work Sans',sans-serif;margin-top:12px;
}
.btn:hover{background:var(--red-bright);}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--cream);}
.btn.ghost:hover{border-color:var(--gold);}

/* Bestell-Modus-Tabs (Gerichte / Sonstige Preise) */
.order-mode-tabs{display:flex;gap:8px;margin-bottom:12px;}
.order-mode-tabs button{
  flex:1;background:var(--ink-3);border:1px solid var(--line);color:var(--cream);
  padding:9px 4px;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;
  font-family:'Work Sans',sans-serif;
}
.order-mode-tabs button.active{background:var(--gold);color:var(--ink);border-color:var(--gold);}

/* Gerichte-Auswahl */
.dish-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.dish-btn{
  background:var(--ink-3);border:1px solid var(--line);color:var(--cream);
  padding:14px 8px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;
  font-family:'Work Sans',sans-serif;text-align:center;
}
/* Farbcode nach Protein/Special — dezente Pastelltöne auf dunklem
   Untergrund, damit Vegan/Huhn/Beef/Specials auf einen Blick erkennbar
   sind. Steht bewusst vor .active-baustein, damit die Gold-Markierung
   "heute ausgewählt" im Katalog-Tab weiterhin Vorrang hat. */
.dish-btn.tag-vegan{background:#bfe6c9;border-color:#9bd1ab;color:#1c1b1a;}
.dish-btn.tag-huhn{background:#f5e3a0;border-color:#e6cf72;color:#1c1b1a;}
.dish-btn.tag-beef{background:#f0b8bb;border-color:#e08f93;color:#1c1b1a;}
.dish-btn.tag-thaitea{background:#b9d7f0;border-color:#8fbde0;color:#1c1b1a;}
.dish-btn.tag-mango{background:#dcc2ea;border-color:#c69ddb;color:#1c1b1a;}
.dish-btn:active{background:var(--red);border-color:var(--red-bright);color:#fff;}
.dish-btn.active-baustein{background:var(--gold);color:var(--ink);border-color:var(--gold);}

<body>

  <span>🍚 REIS IST ALLE!</span>
  <button type="button" id="reisClearBtn">✓ Nachgefüllt</button>
</div>
<div class="layout">
  <div class="app" id="app"></div>
  <div class="side-panel" id="sidePanel">
    <div id="payPanel"></div>
    <div class="panel">
      <h3>Meine Posten <span class="side-count" id="sideCount">0</span></h3>
      <p class="hint" style="margin-bottom:10px;">Offene Thai-Curry- &amp; Drittes-Gericht-Positionen über alle Bestellungen — antippen sobald fertig.</p>

      <h3>Offene Vorbestellungen</h3>

      <div id="vorbestellList"></div>
    </div>

      <button type="button" class="reis-toggle-btn" id="reisBtn">🍚 REIS ist alle</button>
    </div>
  </div>
</div>

<script>
/* ============================= FESTE PREISE =============================
   Startbelegung beim allerersten Öffnen. Danach verwaltet sich die Liste
   selbst über den "Preise verwalten"-Button in der App (im Browser auf
   diesem Gerät gespeichert). */
const DEFAULT_PRICES = [7, 7.50, 8.50, 9.40, 9.90, 10.90, 9.50, 11.90, 12.90];
const PRICES_STORAGE_KEY = 'redlotus_preisrechner_preise';

/* ============================= GERICHTE =============================
   Zweistufige Auswahl: Gericht -> Variante (Protein) -> Größe (Normal/Klein).
   "Klein" ist bei den meisten Gerichten ein fester Pauschalpreis
   (unabhängig vom Gericht) — außer bei Thai Curry, das eigene
   Klein-Preise hat. "vegan:true" an einer Variante bestimmt, welcher
   der beiden Klein-Preise greift. */
const LEGACY_GENERIC_KLEIN = { protein: 8.50, vegan: 7.00 };
const LEGACY_DISH_GROUPS = [
  {
    id: 'thaicurry', name: 'Thai Curry',
    kleinPrices: { protein: 7.50, vegan: 7.00 },
    variants: [
      { label: 'Hühnchen', price: 9.90, vegan: false },
      { label: 'Vegan', price: 9.40, vegan: true }
    ]
  },
  {
    id: 'padthai', name: 'Pad Thai',
    kleinPrices: LEGACY_GENERIC_KLEIN,
    variants: [
      { label: 'Huhn', price: 10.90, vegan: false },
      { label: 'Tofu', price: 9.40, vegan: true }
    ]
  },
  {
    id: 'sichuan', name: 'Sichuan Nudeln',
    kleinPrices: LEGACY_GENERIC_KLEIN,
    variants: [
      { label: 'Beef', price: 13.90, vegan: false },
      { label: 'Chicken', price: 10.90, vegan: false },
      { label: 'Tofu', price: 9.40, vegan: true }
    ]
  },
  {
    id: 'yakisoba', name: 'Yakisoba',
    kleinPrices: LEGACY_GENERIC_KLEIN,
    variants: [
      { label: 'Huhn', price: 9.90, vegan: false },
      { label: 'Tofu', price: 9.40, vegan: true }
    ]
  },
  {
    id: 'kimchiudon', name: 'Kimchi Udon',
    kleinPrices: LEGACY_GENERIC_KLEIN,
    variants: [
      { label: 'Bacon/Chicken', price: 10.90, vegan: false },
      { label: 'Bacon/Chicken mit Ei', price: 11.90, vegan: false },
      { label: 'Tofu', price: 9.40, vegan: true },
      { label: 'Tofu mit Ei', price: 10.40, vegan: true }
    ]
  },
  {
    id: 'hoisin', name: 'Hoisin Chicken',
    kleinPrices: LEGACY_GENERIC_KLEIN,
    variants: [
      { label: 'Chicken', price: 10.90, vegan: false },
      { label: 'Tofu', price: 9.40, vegan: true }
    ]
  },
  {
    id: 'orange', name: 'Orange Chicken',
    kleinPrices: LEGACY_GENERIC_KLEIN,
    variants: [
      { label: 'Chicken', price: 10.90, vegan: false },
      { label: 'Tofu', price: 9.40, vegan: true }
    ]
  },
  {
    id: 'drittes', name: 'Drittes Gericht (Platzhalter)',
    kleinPrices: LEGACY_GENERIC_KLEIN,
    variants: [
      { label: 'Fleisch/Huhn', price: 10.90, vegan: false },
      { label: 'Tofu', price: 9.40, vegan: true }
    ]
  },
  {
    id: 'salat', name: 'Salat',
    kleinPrices: LEGACY_GENERIC_KLEIN, // Klein: 8,50 (Fleisch) / 7,00 (Vegan)
    variants: [
      { label: 'Fleisch/Huhn', price: 10.90, vegan: false },
      { label: 'Vegan', price: 9.40, vegan: true }
    ]
  },
  {
    id: 'suppe', name: 'Suppe',
    kleinPrices: { protein: 7.50, vegan: 7.50 }, // nur eine Größe unterschieden, kein Fleisch/Vegan-Split
    variants: [
      { label: 'Normal', price: 9.50, vegan: false }
    ]
  }
];
const LEGACY_EXTRA_DISH_IDS = ['salat', 'suppe']; // zählen nicht zu den 6 Hauptgerichten
const LEGACY_SPECIALS = [
  { id: 'thaitea', name: 'Thai Tea', price: 4.00 },
  { id: 'mangosticky', name: 'Mango Sticky Rice', price: 6.90 }
];

/* ============================= MARKEN / KATALOG =============================
   Zwei Marken (Red Lotus, Lime & Thyme) mit jeweils eigenem, VOLLSTÄNDIG
   editierbarem Katalog aus "Gerichten" (mit optionalem Klein-Preis) und
   "Specials" (Getränke/Desserts, immer Einzelpreis). Neue Gerichte/Specials
   lassen sich in "⚙ Tagesauswahl" → "🛠 Katalog" hinzufügen, Preise ändern
   und Einträge löschen — alles pro Gerät in localStorage gespeichert.
   Die aktuelle Marke bestimmt, welcher Katalog im Preisrechner angezeigt
   wird; ein Umschalter dafür steht oben im Reiter "Gerichte". */
const BRANDS = [
  { id: 'redlotus', name: 'Red Lotus' },
  { id: 'limethyme', name: 'Lime & Thyme' }
];
function slugify(str){ return String(str).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }
function defaultCatalog(brandId){
  if(brandId === 'limethyme'){
    return {
      dishes: [
        { id: 'lt-banhmi-fleisch', name: 'Banh Mi Huhn/Schwein', price: 9.90, kleinPrice: null, counted: true, group: null },
        { id: 'lt-banhmi-veggie', name: 'Banh Mi Veggie', price: 9.40, kleinPrice: null, counted: true, group: null },
        { id: 'lt-loadedfries', name: 'Loaded Fries', price: 9.50, kleinPrice: null, counted: true, group: null }
      ],
      specials: []
    };
  }
  // 'redlotus' (Standard) — aus den bisherigen DISH_GROUPS abgeleitet.
  const dishes = [];
  LEGACY_DISH_GROUPS.forEach(dish=>{
    const counted = !LEGACY_EXTRA_DISH_IDS.includes(dish.id);
    dish.variants.forEach(v=>{
      const kleinPrice = v.vegan ? dish.kleinPrices.vegan : dish.kleinPrices.protein;
      dishes.push({
        id: dish.id + '-' + slugify(v.label),
        name: dish.name + ' – ' + v.label,
        price: v.price,
        kleinPrice: kleinPrice,
        counted,
        group: dish.id // für "Meine Posten"-Filter (Thai Curry / Drittes Gericht)
      });
    });
  });
  const specials = LEGACY_SPECIALS.map(s=>({ id: 'special-' + s.id, name: s.name, price: s.price }));
  return { dishes, specials };
}
const BRAND_KEY = 'redlotus_preisrechner_marke';
function loadBrand(){
  try{
    const b = localStorage.getItem(BRAND_KEY);
    if(BRANDS.some(x=>x.id===b)) return b;
  }catch(e){ console.warn('Marke konnte nicht geladen werden:', e); }
  return 'redlotus';
}
function saveBrand(b){
  try{ localStorage.setItem(BRAND_KEY, b); }
  catch(e){ console.warn('Marke konnte nicht gespeichert werden:', e); }
}
/* Ein-/Ausklappen des Bestellbereichs (Gerichte/Sonstige Preise) — Wunsch:
   mehr Platz für die Postenliste. Zustand wird pro Gerät gemerkt, damit die
   Kasse beim nächsten Öffnen so bleibt wie zuletzt eingestellt. */
const PICKER_OPEN_KEY = 'redlotus_preisrechner_picker_offen';
function loadPickerOpen(){
  try{
    const v = localStorage.getItem(PICKER_OPEN_KEY);
    if(v === '0') return false;
    if(v === '1') return true;
  }catch(e){ /* ignorieren, Standard verwenden */ }
  return true; // Standard: offen, wie bisher
}
function savePickerOpen(open){
  try{ localStorage.setItem(PICKER_OPEN_KEY, open ? '1' : '0'); }
  catch(e){ console.warn('Konnte Auswahl-Status nicht speichern:', e); }
}

/* Haptisches/akustisches Feedback beim Eintippen einer Bestellposition —
   kurze Vibration (falls unterstützt, z. B. Android-Tablet) plus ein
   dezenter Klickton (funktioniert auch dort, wo Vibration nicht verfügbar
   ist, z. B. iPad/Safari). Kein Audio-File nötig, wird per Web Audio API
   synthetisch erzeugt. */
let feedbackAudioCtx = null;
function playFeedback(){
  try{ if(navigator.vibrate) navigator.vibrate(15); }catch(e){}
  try{
    if(!feedbackAudioCtx){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(Ctx) feedbackAudioCtx = new Ctx();
    }
    if(!feedbackAudioCtx) return;
    if(feedbackAudioCtx.state === 'suspended') feedbackAudioCtx.resume();
    const osc = feedbackAudioCtx.createOscillator();
    const gain = feedbackAudioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.16, feedbackAudioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, feedbackAudioCtx.currentTime + 0.09);
    osc.connect(gain);
    gain.connect(feedbackAudioCtx.destination);
    osc.start();
    osc.stop(feedbackAudioCtx.currentTime + 0.1);
  }catch(e){ /* Feedback ist nur ein Extra, still ignorieren wenn nicht möglich */ }
}

function catalogKey(brandId){ return 'redlotus_preisrechner_katalog_' + brandId; }
function loadCatalog(brandId){
  try{
    const raw = localStorage.getItem(catalogKey(brandId));
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.dishes) && Array.isArray(parsed.specials)) return parsed;
    }
  }catch(e){ console.warn('Katalog konnte nicht geladen werden:', e); }
  return defaultCatalog(brandId);
}
function saveCatalog(brandId, catalog){
  try{ localStorage.setItem(catalogKey(brandId), JSON.stringify(catalog)); }
  catch(e){ console.warn('Katalog konnte nicht gespeichert werden:', e); }
}
function allCatalogItemsFrom(catalog){
  return [
    ...catalog.dishes.map(d => ({ ...d, type: 'dish' })),
    ...catalog.specials.map(s => ({ ...s, type: 'single', counted: false, kleinPrice: null, group: null }))

}

/* ============================= TAGESAUSWAHL (Bausteine) =============================
   Vor Betriebsbeginn wählt Felix aus dem Katalog der aktuellen Marke bis
   zu 6 HAUPTGERICHTE für den Tag aus (in "⚙ Tagesauswahl"). Gerichte mit
   counted:false (Salat, Suppe, Specials, …) sind ebenfalls dort
   an-/abschaltbar, zählen aber NICHT gegen die 6er-Grenze. Die Größe
   (Normal/Klein) zählt bei normalen Gerichten ebenfalls nicht extra mit —
   ist ein Gericht aktiv, stehen beide Größen automatisch als Buttons zur
   Verfügung. Auswahl wird pro Marke und Gerät in localStorage gemerkt. */
const MAX_ACTIVE_BAUSTEINE = 6;
function countedActiveCount(ids){
  const items = allCatalogItemsFrom(state.catalog);
  return ids.filter(id => {
    const b = items.find(x=>x.id===id);
    return b && b.counted;
  }).length;
}
function activeKey(brandId){ return 'redlotus_preisrechner_tagesauswahl_' + brandId; }
function loadActiveBausteine(brandId, catalog){
  try{
    const raw = localStorage.getItem(activeKey(brandId));
    if(raw){
      const arr = JSON.parse(raw);
      if(Array.isArray(arr)){
        const ids = allCatalogItemsFrom(catalog).map(b=>b.id);
        return arr.filter(id => ids.includes(id));
      }
    }
  }catch(e){ console.warn('Tagesauswahl konnte nicht geladen werden:', e); }
  return [];
}
function saveActiveBausteine(){
  try{ localStorage.setItem(activeKey(state.brand), JSON.stringify(state.activeBausteinIds)); }
  catch(e){ console.warn('Tagesauswahl konnte nicht gespeichert werden:', e); }
}

   functions/index.js) — diese vergibt die Tagesnummer serverseitig und
   ist die einzige Stelle, die in die "orders"-Collection schreiben darf.
   TODO nach dem ersten Deploy der Function die URL prüfen (Firebase gibt
   sie beim Deploy aus) — Muster wie bei den anderen Functions im Kalender. */
const CREATE_ORDER_URL = "https://createorder-e6seurotja-uc.a.run.app?key=rl_wix_h7k2m9p4";
function escapeHtmlPR(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function loadPrices(){
  try{
    const raw = localStorage.getItem(PRICES_STORAGE_KEY);
    if(raw){
      const arr = JSON.parse(raw);
      if(Array.isArray(arr) && arr.length) return arr;
    }
  }catch(e){ console.warn('Preise konnten nicht geladen werden, nutze Standardliste:', e); }
  return DEFAULT_PRICES.slice();
}
function savePrices(prices){
  try{ localStorage.setItem(PRICES_STORAGE_KEY, JSON.stringify(prices)); }
  catch(e){ console.warn('Preise konnten nicht gespeichert werden:', e); }
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmtEUR(n){ return (n||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €'; }
function parseEntry(str){
  if(!str) return 0;
  return parseFloat(str.replace(',','.')) || 0;
}
function total(){

}
function addItem(price, label, dishId){

    playFeedback();
  }
}

/* Farbcode nach Protein/Special — pastellig, damit man auf einen Blick
   sieht, was vegan/Huhn/Beef ist bzw. welches Special gemeint ist.
   Reihenfolge wichtig: "Tofu"/"Vegan"/"Veggie" zuerst prüfen, damit z. B.
   "Hoisin Chicken – Tofu" (Basisname enthält "Chicken") trotzdem als vegan
   erkannt wird. */
function dishTagClass(name){
  const n = (name||'').toLowerCase();
  if(/vegan|veggie|tofu/.test(n)) return 'tag-vegan';
  if(/huhn|hühnchen|chicken/.test(n)) return 'tag-huhn';
  if(/beef|rind|steak/.test(n)) return 'tag-beef';
  if(/thai\s*tea/.test(n)) return 'tag-thaitea';
  if(/mango.*sticky|sticky.*mango/.test(n)) return 'tag-mango';
  return '';
}

/* ============================= HANDLERS ============================= */
function attachHandlers(){
  document.querySelectorAll('[data-static-price]').forEach(btn=>btn.onclick=()=>{
    if(state.editMode) return;
    addItem(parseFloat(btn.dataset.staticPrice));
    render();
  });

  const toggleEditBtn = document.getElementById('toggleEditBtn');
  if(toggleEditBtn) toggleEditBtn.onclick = ()=>{
    state.editMode = !state.editMode;
    state.newPriceEntry = '';
    render();
  };

  const toggleCustomBtn = document.getElementById('toggleCustomBtn');
  if(toggleCustomBtn) toggleCustomBtn.onclick = ()=>{
    state.showCustomEntry = !state.showCustomEntry;
    render();
  };

  document.querySelectorAll('[data-del-price]').forEach(btn=>btn.onclick=()=>{
    const idx = parseInt(btn.dataset.delPrice, 10);
    state.prices.splice(idx, 1);
    savePrices(state.prices);
    render();
  });

  const newPriceInput = document.getElementById('newPriceInput');
  if(newPriceInput){
    newPriceInput.oninput = ()=>{ state.newPriceEntry = newPriceInput.value; };
    newPriceInput.onkeydown = (ev)=>{ if(ev.key==='Enter') addPriceBtn.click(); };
  }
  const addPriceBtn = document.getElementById('addPriceBtn');
  if(addPriceBtn) addPriceBtn.onclick = ()=>{
    const val = parseEntry(state.newPriceEntry);
    if(val>0){
      state.prices.push(val);
      savePrices(state.prices);
      state.newPriceEntry = '';
      render();
    }
  };

  document.querySelectorAll('[data-key]').forEach(btn=>btn.onclick=()=>{
    const k = btn.dataset.key;
    if(k==='clear'){ state.entry = state.entry.slice(0,-1); }
    else if(k==='add'){
      addItem(parseEntry(state.entry));
      state.entry='';
    } else if(k===','){
      if(!state.entry.includes(',')) state.entry += (state.entry?',':'0,');
    } else {
      if(state.entry==='0') state.entry = k;
      else state.entry += k;
    }
    render();
  });

  document.querySelectorAll('[data-paid-key]').forEach(btn=>btn.onclick=()=>{
    const k = btn.dataset.paidKey;
    state.paid = null;
    if(k==='clear'){ state.paidEntry = state.paidEntry.slice(0,-1); }
    else if(k===','){
      if(!state.paidEntry.includes(',')) state.paidEntry += (state.paidEntry?',':'0,');
    } else {
      if(state.paidEntry==='0') state.paidEntry = k;
      else state.paidEntry += k;
    }
    render();
  });

  document.querySelectorAll('[data-paid-quick]').forEach(btn=>btn.onclick=()=>{
    state.paid = parseFloat(btn.dataset.paidQuick);
    state.paidEntry = '';
    render();
  });

  document.querySelectorAll('[data-del-item]').forEach(btn=>btn.onclick=()=>{
    state.items = state.items.filter(it=>it.id!==btn.dataset.delItem);
    render();
  });

  // Box-Vermerk pro Posten: einfaches An/Aus ("eigene Box" oder kein Vermerk).
  document.querySelectorAll('[data-cycle-box]').forEach(btn=>btn.onclick=()=>{
    const it = state.items.find(x=>x.id===btn.dataset.cycleBox);
    if(!it) return;
    it.box = it.box==='eigene' ? null : 'eigene';
    // Sammel-Schalter nachziehen: nur "aktiv", wenn wirklich ALLE Posten eigene Box haben.
    state.allEigeneBox = state.items.length>0 && state.items.every(x=>x.box==='eigene');
    render();
  });

  // "Alles eigene Box" — 1 Tipp setzt/entfernt die Box bei allen aktuellen
  // und künftig hinzugefügten Posten dieser Bestellung.
  const allEigeneBoxBtn = document.getElementById('allEigeneBoxBtn');
  if(allEigeneBoxBtn) allEigeneBoxBtn.onclick = ()=>{
    state.allEigeneBox = !state.allEigeneBox;
    state.items.forEach(it => it.box = state.allEigeneBox ? 'eigene' : null);
    render();
  };

  // Hier essen / To-Go — gilt für die ganze aktuelle Bestellung.
  document.querySelectorAll('[data-dine-mode]').forEach(btn=>btn.onclick=()=>{
    state.dineMode = btn.dataset.dineMode;
    render();
  });

  // Bestell-Modus-Tabs (Gerichte / Sonstige Preise)
  document.querySelectorAll('[data-order-mode]').forEach(btn=>btn.onclick=()=>{
    state.orderMode = btn.dataset.orderMode;
    render();
  });

  // Bestellbereich (Gerichte/Sonstige Preise) ein-/ausblenden — mehr Platz
  // für die Postenliste, wenn gerade nichts ausgewählt werden muss.
  const togglePickerBtn = document.getElementById('togglePickerBtn');
  if(togglePickerBtn) togglePickerBtn.onclick = ()=>{
    state.pickerOpen = !state.pickerOpen;
    savePickerOpen(state.pickerOpen);
    render();
  };

  // Marke umschalten (Red Lotus / Lime & Thyme) — lädt den jeweiligen Katalog
  // und die dazu gespeicherte Tagesauswahl neu.
  document.querySelectorAll('[data-select-brand]').forEach(btn=>btn.onclick=()=>{
    const id = btn.dataset.selectBrand;
    if(id === state.brand) return;
    state.brand = id;
    saveBrand(id);
    state.catalog = loadCatalog(id);
    state.activeBausteinIds = loadActiveBausteine(id, state.catalog);
    state.dishAdminMode = false;
    render();
  });

  // Tagesauswahl (bis zu 6 Hauptgerichte) verwalten
  const toggleDishAdminBtn = document.getElementById('toggleDishAdminBtn');
  if(toggleDishAdminBtn) toggleDishAdminBtn.onclick = ()=>{
    state.dishAdminMode = !state.dishAdminMode;
    render();
  };
  document.querySelectorAll('[data-admin-tab]').forEach(btn=>btn.onclick=()=>{
    state.dishAdminTab = btn.dataset.adminTab;
    render();
  });
  document.querySelectorAll('[data-toggle-baustein]').forEach(btn=>btn.onclick=()=>{
    const id = btn.dataset.toggleBaustein;
    const b = allCatalogItemsFrom(state.catalog).find(x=>x.id===id);
    if(!b) return;
    const idx = state.activeBausteinIds.indexOf(id);
    if(idx>=0){
      state.activeBausteinIds.splice(idx,1);
    } else {
      if(b.counted && countedActiveCount(state.activeBausteinIds) >= MAX_ACTIVE_BAUSTEINE){
        alert('Maximal ' + MAX_ACTIVE_BAUSTEINE + ' Hauptgerichte gleichzeitig auswählbar — zuerst eins entfernen. (Extra-Gerichte und Specials zählen nicht mit.)');
        return;
      }
      state.activeBausteinIds.push(id);
    }
    saveActiveBausteine();
    render();
  });

  // Baustein antippen -> direkt als Posten hinzufügen (kein weiterer Zwischenschritt).
  document.querySelectorAll('[data-add-baustein]').forEach(btn=>btn.onclick=()=>{
    const b = allCatalogItemsFrom(state.catalog).find(x=>x.id===btn.dataset.addBaustein);
    if(!b) return;
    if(b.type === 'single' || b.kleinPrice == null){
      addItem(b.price, b.name, b.group || null);
    } else {
      const isKlein = btn.dataset.size === 'klein';
      const price = isKlein ? b.kleinPrice : b.price;
      const label = b.name + (isKlein ? ' (Klein)' : '');
      addItem(price, label, b.group || null);
    }
    render();
  });

  // Katalog verwalten: Gerichte bearbeiten/löschen/hinzufügen.
  document.querySelectorAll('[data-edit-dish]').forEach(btn=>btn.onclick=()=>{
    const d = state.catalog.dishes.find(x=>x.id===btn.dataset.editDish);
    if(!d) return;
    const newPriceStr = prompt('Neuer Preis für "' + d.name + '" (Normal):', String(d.price).replace('.',','));
    if(newPriceStr === null) return;
    const newPrice = parseEntry(newPriceStr);
    if(newPrice <= 0){ alert('Ungültiger Preis.'); return; }
    d.price = newPrice;
    const kleinDefault = d.kleinPrice != null ? String(d.kleinPrice).replace('.',',') : '';
    const kleinStr = prompt('Klein-Preis für "' + d.name + '" (leer lassen = kein Klein-Preis):', kleinDefault);
    if(kleinStr !== null){
      const kleinTrim = kleinStr.trim();
      if(kleinTrim === ''){
        d.kleinPrice = null;
      } else {
        const kleinVal = parseEntry(kleinTrim);
        if(kleinVal > 0) d.kleinPrice = kleinVal;
      }
    }
    saveCatalog(state.brand, state.catalog);
    render();
  });
  document.querySelectorAll('[data-del-dish]').forEach(btn=>btn.onclick=()=>{
    const d = state.catalog.dishes.find(x=>x.id===btn.dataset.delDish);
    if(!d) return;
    if(!confirm('"' + d.name + '" wirklich aus dem Katalog löschen?')) return;
    state.catalog.dishes = state.catalog.dishes.filter(x=>x.id!==d.id);
    state.activeBausteinIds = state.activeBausteinIds.filter(id=>id!==d.id);
    saveCatalog(state.brand, state.catalog);
    saveActiveBausteine();
    render();
  });
  const newDishNameInput = document.getElementById('newDishName');
  if(newDishNameInput) newDishNameInput.oninput = ()=>{ state.newDishName = newDishNameInput.value; };
  const newDishPriceInput = document.getElementById('newDishPrice');
  if(newDishPriceInput) newDishPriceInput.oninput = ()=>{ state.newDishPrice = newDishPriceInput.value; };
  const newDishKleinInput = document.getElementById('newDishKlein');
  if(newDishKleinInput) newDishKleinInput.oninput = ()=>{ state.newDishKlein = newDishKleinInput.value; };
  const newDishCountedInput = document.getElementById('newDishCounted');
  if(newDishCountedInput) newDishCountedInput.onchange = ()=>{ state.newDishCounted = newDishCountedInput.checked; };
  const addDishBtn = document.getElementById('addDishBtn');
  if(addDishBtn) addDishBtn.onclick = ()=>{
    const name = state.newDishName.trim();
    const price = parseEntry(state.newDishPrice);
    const kleinTrim = state.newDishKlein.trim();
    const kleinVal = kleinTrim ? parseEntry(kleinTrim) : 0;
    if(!name || price<=0){ alert('Bitte Name und einen gültigen Preis eingeben.'); return; }
    state.catalog.dishes.push({
      id: 'custom-' + uid(),
      name,
      price,
      kleinPrice: kleinVal > 0 ? kleinVal : null,
      counted: state.newDishCounted,
      group: null
    });
    saveCatalog(state.brand, state.catalog);
    state.newDishName = ''; state.newDishPrice = ''; state.newDishKlein = ''; state.newDishCounted = true;
    render();
  };

  // Katalog verwalten: Specials bearbeiten/löschen/hinzufügen.
  document.querySelectorAll('[data-edit-special]').forEach(btn=>btn.onclick=()=>{
    const s = state.catalog.specials.find(x=>x.id===btn.dataset.editSpecial);
    if(!s) return;
    const newPriceStr = prompt('Neuer Preis für "' + s.name + '":', String(s.price).replace('.',','));
    if(newPriceStr === null) return;
    const newPrice = parseEntry(newPriceStr);
    if(newPrice <= 0){ alert('Ungültiger Preis.'); return; }
    s.price = newPrice;
    saveCatalog(state.brand, state.catalog);
    render();
  });
  document.querySelectorAll('[data-del-special]').forEach(btn=>btn.onclick=()=>{
    const s = state.catalog.specials.find(x=>x.id===btn.dataset.delSpecial);
    if(!s) return;
    if(!confirm('"' + s.name + '" wirklich aus dem Katalog löschen?')) return;
    state.catalog.specials = state.catalog.specials.filter(x=>x.id!==s.id);
    state.activeBausteinIds = state.activeBausteinIds.filter(id=>id!==s.id);
    saveCatalog(state.brand, state.catalog);
    saveActiveBausteine();
    render();
  });
  const newSpecialNameInput = document.getElementById('newSpecialName');
  if(newSpecialNameInput) newSpecialNameInput.oninput = ()=>{ state.newSpecialName = newSpecialNameInput.value; };
  const newSpecialPriceInput = document.getElementById('newSpecialPrice');
  if(newSpecialPriceInput) newSpecialPriceInput.oninput = ()=>{ state.newSpecialPrice = newSpecialPriceInput.value; };
  const addSpecialBtn = document.getElementById('addSpecialBtn');
  if(addSpecialBtn) addSpecialBtn.onclick = ()=>{
    const name = state.newSpecialName.trim();
    const price = parseEntry(state.newSpecialPrice);
    if(!name || price<=0){ alert('Bitte Name und einen gültigen Preis eingeben.'); return; }
    state.catalog.specials.push({ id: 'custom-' + uid(), name, price });
    saveCatalog(state.brand, state.catalog);
    state.newSpecialName = ''; state.newSpecialPrice = '';
    render();
  };

  // Vorbestellung
  const vorbestellToggle = document.getElementById('vorbestellToggle');
  if(vorbestellToggle) vorbestellToggle.onclick = ()=>{
    state.isVorbestellung = !state.isVorbestellung;
    render();
  };
  const vorbestellZeit = document.getElementById('vorbestellZeit');
  if(vorbestellZeit) vorbestellZeit.oninput = ()=>{ state.vorbestellZeit = vorbestellZeit.value; };

  // An Küche senden
  const sendKitchenBtn = document.getElementById('sendKitchenBtn');
  if(sendKitchenBtn) sendKitchenBtn.onclick = async ()=>{
    if(state.items.length===0 || state.sending) return;
    state.sending = true;
    render();
    try{
      const res = await fetch(CREATE_ORDER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          items: state.items.map(it => ({ label: it.label || 'Position', price: it.price, box: it.box || null, dishId: it.dishId || null, done: false })),
          total: total(),
          dineMode: state.dineMode,
          isVorbestellung: state.isVorbestellung,
          pickupTime: state.isVorbestellung ? state.vorbestellZeit : null
        })
      });
      const data = await res.json();
      if(data && data.ok){
        if(state.isVorbestellung){
          // Vorbestellungen werden erst bei Abholung bezahlt — die Kasse
          // darf dafür nicht blockieren. Sofort für den nächsten Verkauf
          // zurücksetzen; die Bestellung bleibt in "Offene Vorbestellungen"
          // (rechtes Seitenpanel) greifbar, bis dort "💰 Bezahlt" gedrückt wird.
          alert('Vorbestellung #' + data.number + ' angenommen für ' + (state.vorbestellZeit || '—') + ' — Zahlung erfolgt bei Abholung (siehe „Offene Vorbestellungen").');
          resetOrder();
        } else {
          state.orderNumber = data.number;
        }
      } else {
        alert('Bestellung konnte nicht an die Küche gesendet werden: ' + (data && data.error || 'unbekannter Fehler'));
      }
    }catch(err){
      alert('Bestellung konnte nicht gesendet werden — bitte Internetverbindung prüfen. (' + err.message + ')');
    }
    state.sending = false;
    render();
  };

  function resetOrder(){
    // Nur die aktuelle Bestellung zurücksetzen — Preis-Buttons und
    // Tagesauswahl (activeBausteinIds) bleiben erhalten.
    state.items = [];
    state.entry = '';
    state.paidEntry = '';
    state.paid = null;
    state.dineMode = 'togo';
    state.allEigeneBox = false;
    state.isVorbestellung = false;
    state.vorbestellZeit = '';
    state.orderNumber = null;
    render();
  }

  const resetBtn = document.getElementById('resetBtn');
  if(resetBtn) resetBtn.onclick = resetOrder;

  const paidBtn = document.getElementById('paidBtn');
  if(paidBtn) paidBtn.onclick = resetOrder;
}

render();

// Service Worker registrieren — nötig, damit Chrome/Android "App
// installieren" statt nur "Verknüpfung hinzufügen" anbietet.
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw-preisrechner.js').catch(err=>{
    console.warn('Service Worker konnte nicht registriert werden:', err);
  });
}
</script>

<script type="module">
/* ============================= "MEINE POSTEN" + REIS-ALARM =============================
   Eigenes, unabhängiges Modul: liest live aus Firestore alle offenen
   Bestellungen und zeigt rechts (auf Tablets) eine kompakte Liste aller noch
   nicht abgehakten Thai-Curry- und Drittes-Gericht-Positionen — also genau
   die Station an der Kasse. Nutzt dieselbe "orders"-Collection wie
   Küchen-/Kundenbildschirm; Schreibrechte sind in firestore.rules auf
   status/readyAt/items begrenzt (kein Login nötig). */
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js';
import {
  getFirestore, initializeFirestore, collection, query, where, onSnapshot, doc, updateDoc, setDoc
} from 'https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyA0y6NWpF3N7241mA72Cj-gU_pvbqpNdD4",
  authDomain: "red-lotus-eventkalender.firebaseapp.com",
  projectId: "red-lotus-eventkalender",
  storageBucket: "red-lotus-eventkalender.firebasestorage.app",
  messagingSenderId: "864967561482",
  appId: "1:864967561482:web:98ee51f304748e511f2af3"
};
const fbApp = initializeApp(firebaseConfig, 'preisrechner-orders');
const db = initializeFirestore(fbApp, { experimentalAutoDetectLongPolling: true }, "default");

// Dish-IDs der eigenen Station (Kasse: Thai Curry + Drittes Gericht) — muss
// zu den "group"-Werten der Red-Lotus-Katalogeinträge oben im Haupt-Script
// passen (nur für Red-Lotus-Gerichte gesetzt, siehe defaultCatalog()).
const MEINE_DISH_IDS = ['thaicurry', 'drittes'];

function escapeHtmlM(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderMinePosten(orders){
  const list = document.getElementById('minePostenList');
  const count = document.getElementById('sideCount');
  if(!list) return;

  const rows = [];
  orders.forEach(o => {
    (o.items||[]).forEach((it, idx) => {
      if(it.dishId && MEINE_DISH_IDS.includes(it.dishId) && !it.done){
        rows.push({ orderId: o.id, orderNumber: o.number, idx, label: it.label, box: it.box });
      }
    });
  });

  if(count) count.textContent = String(rows.length);

  if(!rows.length){
    list.innerHTML = '<div class="mine-empty">Alles erledigt ✓</div>';
    return;
  }

  list.innerHTML = rows.map(r => `
    <div class="mine-item" data-mine-toggle="${r.orderId}" data-mine-idx="${r.idx}">
      <span class="mine-check"></span>
      <span class="mine-order-no">#${r.orderNumber}</span>
      <span>${escapeHtmlM(r.label||'Position')}${r.box==='eigene' ? ' · 🥡 eigene Box' : ''}</span>
    </div>
  `).join('');

  list.querySelectorAll('[data-mine-toggle]').forEach(row=>{
    row.onclick = async ()=>{
      const order = orders.find(o => o.id === row.dataset.mineToggle);
      if(!order) return;
      const idx = parseInt(row.dataset.mineIdx, 10);
      const newItems = (order.items||[]).map((it,i)=> i===idx ? { ...it, done: true } : it);
      try{
        await updateDoc(doc(db, 'orders', order.id), { items: newItems });
      }catch(e){
        console.error('Konnte Position nicht abhaken:', e);
      }
    };
  });
}

function renderReadyToGo(orders){
  const panel = document.getElementById('readyPanel');
  const list = document.getElementById('readyList');
  if(!panel || !list) return;

  const ready = orders.filter(o => (o.items||[]).length > 0 && (o.items||[]).every(it => it.done));
  if(!ready.length){
    panel.style.display = 'none';
    list.innerHTML = '';
    return;
  }
  panel.style.display = '';
  list.innerHTML = ready.map(o => `
    <div class="ready-card">
      <div class="ready-no">#${o.number}</div>
      <ul>${(o.items||[]).map(it => `<li>${escapeHtmlM(it.label||'Position')}</li>`).join('')}</ul>
      <button type="button" data-give-out="${o.id}">✓ Ausgegeben</button>
    </div>
  `).join('');

  list.querySelectorAll('[data-give-out]').forEach(btn=>{
    btn.onclick = async ()=>{
      btn.disabled = true;
      btn.textContent = '…';
      try{
        await updateDoc(doc(db, 'orders', btn.dataset.giveOut), {
          status: 'fertig',
          readyAt: new Date().toISOString()
        });
      }catch(e){
        console.error('Konnte Bestellung nicht als ausgegeben markieren:', e);
        btn.disabled = false;
        btn.textContent = '✓ Ausgegeben';
      }
    };
  });
}

function fmtEURm(n){ return (n||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €'; }

// Offene Vorbestellungen: bezahlt erst bei Abholung, deshalb unabhängig vom
// Status "offen"/"fertig" sichtbar, bis "paid" gesetzt wird. Eigene, einfache
// Gleichheits-Abfrage (kein Index nötig) — Status "archiviert" (nach "Neue
// Session") wird clientseitig herausgefiltert.
function renderVorbestellungen(orders){
  const panel = document.getElementById('vorbestellPanel');
  const list = document.getElementById('vorbestellList');
  if(!panel || !list) return;

  const open = orders
    .filter(o => !o.paid && o.status !== 'archiviert')
    .sort((a,b) => (a.pickupTime||'').localeCompare(b.pickupTime||''));

  if(!open.length){
    panel.style.display = 'none';
    list.innerHTML = '';
    return;
  }
  panel.style.display = '';
  list.innerHTML = open.map(o => `
    <div class="vorbestell-card">
      <div class="vorbestell-no">#${o.number} · 🕒 ${escapeHtmlM(o.pickupTime||'—')}</div>
      <ul>${(o.items||[]).map(it => `<li>${escapeHtmlM(it.label||'Position')}</li>`).join('')}</ul>
      <div class="vorbestell-total">${fmtEURm(o.total)}</div>
      <div class="vorbestell-actions">
        ${o.released
          ? `<span class="vorbestell-released-tag">✓ in der Küche</span>`
          : `<button type="button" data-release-order="${o.id}">📟 An Küche freigeben</button>`}
        <button type="button" data-mark-paid="${o.id}">💰 Bezahlt</button>
      </div>
    </div>
  `).join('');

  list.querySelectorAll('[data-mark-paid]').forEach(btn=>{
    btn.onclick = async ()=>{
      btn.disabled = true;
      btn.textContent = '…';
      try{
        await updateDoc(doc(db, 'orders', btn.dataset.markPaid), { paid: true });
      }catch(e){
        console.error('Konnte Vorbestellung nicht als bezahlt markieren:', e);
        btn.disabled = false;
        btn.textContent = '💰 Bezahlt';
      }
    };
  });

  // "An Küche freigeben": erst ab diesem Klick (z. B. wenn der Kunde sich
  // vor Ort meldet) erscheint die Vorbestellung als aktiver Auftrag auf dem
  // Küchenbildschirm — vorher liegt sie dort nur ausgeblendet in der
  // Vorbestellungen-Vorschau, um das Board nicht zuzumüllen.
  list.querySelectorAll('[data-release-order]').forEach(btn=>{
    btn.onclick = async ()=>{
      btn.disabled = true;
      btn.textContent = '…';
      try{
        await updateDoc(doc(db, 'orders', btn.dataset.releaseOrder), { released: true });
      }catch(e){
        console.error('Konnte Vorbestellung nicht an Küche freigeben:', e);
        btn.disabled = false;
        btn.textContent = '📟 An Küche freigeben';
      }
    };
  });
}

const ordersQuery = query(collection(db, 'orders'), where('status', '==', 'offen'));
onSnapshot(ordersQuery, (snap) => {
  const orders = [];
  snap.forEach(d => orders.push({ id: d.id, ...d.data() }));
  renderMinePosten(orders);
  renderReadyToGo(orders);
}, (err) => console.error('"Meine Posten": Verbindung zu Firestore fehlgeschlagen:', err));

const vorbestellQuery = query(collection(db, 'orders'), where('isVorbestellung', '==', true));
onSnapshot(vorbestellQuery, (snap) => {
  const orders = [];
  snap.forEach(d => orders.push({ id: d.id, ...d.data() }));
  renderVorbestellungen(orders);
}, (err) => console.error('"Offene Vorbestellungen": Verbindung zu Firestore fehlgeschlagen:', err));

// REIS!-Alarm: gemeinsames Signal mit dem Küchenbildschirm.
const reisBanner = document.getElementById('reisBanner');
const reisClearBtn = document.getElementById('reisClearBtn');
const reisBtn = document.getElementById('reisBtn');
onSnapshot(doc(db, 'alerts', 'reis'), (snap) => {
  const active = snap.exists() && snap.data().active;
  if(reisBanner) reisBanner.classList.toggle('show', !!active);
  if(reisBtn) reisBtn.classList.toggle('active', !!active);
}, (err) => console.error('REIS-Alarm: Verbindung fehlgeschlagen:', err));

if(reisBtn) reisBtn.onclick = async ()=>{
  try{ await setDoc(doc(db, 'alerts', 'reis'), { active: true, activatedAt: new Date().toISOString() }); }
  catch(e){ console.error('REIS-Alarm konnte nicht ausgelöst werden:', e); }
};
if(reisClearBtn) reisClearBtn.onclick = async ()=>{
  try{ await setDoc(doc(db, 'alerts', 'reis'), { active: false }, { merge: true }); }
  catch(e){ console.error('REIS-Alarm konnte nicht quittiert werden:', e); }
};
</script>
</body>
</html>
